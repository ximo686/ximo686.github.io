  <script>
    const chapters = [{"id": "001", "title": "回到开服前夜", "time": "2041年7月17日 23:41", "location": "现实世界，江临市出租屋", "paragraphs": ["林夜猛地睁开眼时，胸口还残留着一阵尖锐的窒息感，像是刚从深水里被人按着头拖出来，肺叶里全是没吐干净的血腥味。他几乎是本能地抬手去摸腰侧，五指抓住的却不是惯用的短刀，也不是绑在侧腰的箭袋，只是一团被压皱的薄被。", "头顶的老风扇发出单调的转轴声，窗外还有雨，雨点敲在楼下铁皮棚上，发出一片细碎而密集的噼啪声。空气里没有黑裂谷深处那股硫磺、腐肉和潮湿岩灰混在一起的怪味，也没有追兵逼近时那种让人头皮发麻的安静。房间太普通了，普通到让林夜僵在床上，半天没有动。", "前一刻，他明明还在黑裂谷里。", "那地方是《天灾》后期出了名的绝地，越往深处走，地势越碎，视野越暗，裂开的岩壁像被某种高温烧过，踩上去会掉下一层发黑的石皮。更麻烦的是，那里常年弥漫着一种说不清来源的污染雾，伤口一旦沾上，药剂效果会迅速衰减。林夜被人一路逼进去的时候，身上只剩最后几支箭，肩头的旧伤早就被拖成了新伤，后面的追兵却一点不急，像放猎犬一样慢慢吊着他，逼他继续往前。", "他到现在都记得那道带笑的声音。", "“往里赶，里面有东西收他。”", "林夜撑着床沿坐起来，膝盖撞在木床边角，疼得他眉头一抽。这点真实的疼，反倒让他脑子清醒了些。他低头看向自己的手，手背干净，虎口和指节也没有长期拉弓留下的裂口与硬茧，皮肤甚至还有一点年轻人才有的薄白。", "这不是三年后的手。", "他抬头看向床边电子钟。", "`2041年7月17日 23:41`", "林夜盯着那串红色数字看了几秒，喉结缓缓滚动了一下。日期没错。这个夜晚他记得很清楚，因为再过十九分钟，《天灾》会正式全球开服，所有购买了接入设备的人，都会在零点进入那片后来把整个世界都搅得天翻地覆的地方。", "他起身下床，推开卫生间的门，用冷水狠狠干了一把脸。镜子里映出来的是一张年轻许多的脸，眉眼还带着明显的疲惫，像一个通宵等游戏开服的普通青年，而不是后来那个在野外一待就是十几个小时、连伤口裂开都顾不上皱眉的老弓手。", "可眼神不一样。", "林夜盯着镜子里的自己，越看越沉默。他知道自己前世不是最顶尖的那批人，没有资格接触所有秘密，也从没真正站上过《天灾》的最高处，但三年的厮杀、失误、争抢、逃命和反杀，是实打实刻进骨子里的。一个普通噩梦，不会把这些东西原封不动地带回来。", "他回到桌边，按亮电脑屏幕。官方页面已经挂在桌面上，醒目的开服倒计时还在一秒一秒往下跳。", "`00:18:26`", "论坛此刻热闹得像炸了锅，讨论最多的还是职业、天赋和主城方向。有人猜法师前景最好，有人说盾卫才是开荒硬通货，也有人已经开始畅想自己一进游戏就抽到S级以上的强力天赋，从此一飞冲天。林夜看着那些帖子，心里却没有太多波动。", "他前世的起点其实不差，A 级天赋，弓箭手正适配，属于普通玩家里能让人羡慕一下的档次。可真进了游戏以后他才知道，开局好坏固然重要，真正能把人拉开很远的，往往是后面无数次选择叠起来的结果。路线走错，天赋再好也会被浪费；判断够准，就算起步慢一点，也能一点点追上去。", "想到这里，林夜的呼吸终于稳了一些。", "可就在这时，他右手手背忽然传来一阵很轻的灼热，像有一根针在皮肤下面极快地划了一下。林夜立刻低头，只看见一缕极淡的银白纹路从皮下浮起，眨眼又沉了回去，快得像错觉。", "他盯着手背看了片刻，什么都没说，只是慢慢把手收紧。", "至少有一件事已经可以确定。", "他不是在做梦。"]},{"id": "002", "title": "先把人活明白", "time": "2041年7月17日 23:42至23:48", "location": "现实世界，江临市出租屋", "paragraphs": ["房间重新安静下来以后，林夜没有第一时间去碰接入头盔。", "他坐回椅子里，手肘压在膝盖上，盯着屏幕右上角那串越来越短的倒计时，脑子里翻起来的却不是开服后的风光，而是黑裂谷最后那几分钟。谁堵住了哪条退路，谁专门留着技能没交，谁一直站在最安全的位置看他往里逃，这些细节像烧红的铁丝一样，一根根缠在他神经上。", "那股火刚往上翻，林夜就自己把它掐住了。", "现在去想报仇，除了让自己更乱，没有任何意义。前世他见过太多人死在这种情绪上，明明还有时间发育，明明还有机会补足差距，却总想着把那口气立刻讨回来，结果越急越错，最后把自己送成一份别人懒得多看一眼的战利品。", "他不会再犯这种蠢。", "账当然要算，但那得建立在他先活下来、先站稳、先重新把实力堆起来的前提上。要是连这点顺序都分不清，那他重来这一次和白送没区别。", "林夜闭上眼，开始把自己前世真正有用的记忆往外捞。", "他知道的东西其实不少。哪些地图前期人少收益高，哪些怪技能看着唬人实则很好拆，哪些公共任务给的铜币最扎实，哪些材料一开始不值钱、过几个阶段却会突然翻倍，还有一些后来才被人挖出来的偏门路线和隐藏入口，他都记得一部分。可他也清楚，自己绝不是什么全知全能的重生者。", "他前世最强的时候，也不过是从一线边缘往上摸的高玩弓手。打架够稳，野外经验够多，吃版本理解和路线选择的红利，真到了那些顶级公会和核心势力对撞的时候，他更多还是站在外圈。很多最本质的真相，他压根接触不到。", "所以他现在能依赖的，不是“知道一切”，而是“知道什么最该先做”。", "开服前期最值钱的东西，从来不是一句空泛的先机，而是能不能把最早那段时间差变成真正摸得着的收益。你比别人早拿几枚铜币，早攒一轮箭矢补给，早换上一件更顺手的装备，早去到一个别人暂时还够不着的地方，这些优势单看都不夸张，可它们会层层叠上去，越往后滚越大。", "林夜前世最难受的时候，不是完全没有机会，而是总比别人晚半步。一个资源点刚知道，就已经被人吃过；一条偏线刚听说，就已经被公会踩熟；一件很适合自己的装备刚传出消息，价格已经涨得离谱。那种“明明知道有好东西，却总是迟一步”的感觉，比从头不知道还让人憋得难受。", "也正因为吃过太多这种亏，他现在反而清楚，开服第一夜最忌讳的就是贪。", "什么都想要，结果往往是什么都抓不住。", "林夜睁开眼，目光落在地图论坛一个很不起眼的讨论帖上，记忆里也跟着慢慢浮出一个地名。", "青石村东侧。", "那片区域前期不算热门，地形又绕，普通新手过去只会觉得麻烦，很多人直到离村都没真正把那边摸明白。可林夜记得，那里藏着一条很值钱的偏线，前提是动作得快，路线得准，还得有足够的细心把它从一堆杂乱信息里认出来。", "这就够了。", "他现在要做的，不是幻想自己重生以后会不会忽然天胡开局，也不是在脑子里提前把所有大机缘都安排一遍，而是先抓住这一条自己能确定的、能兑现的路。真要有额外变化，那是锦上添花；没有，他照样能靠记忆先跑起来。", "想明白这一层，林夜胸口那股一直绷着的劲总算顺了下来。", "他不再去碰那些离现在还很远的东西，只把注意力压回眼前。", "离零点，还有十几分钟。", "这十几分钟不够他逆天改命，却足够他把自己先摆回正确的位置。"]},{"id": "003", "title": "别先信天命", "time": "2041年7月17日 23:48至23:55", "location": "现实世界，江临市出租屋", "paragraphs": ["人一旦确认自己真回到了过去，脑子就很难不往更夸张的方向跑。", "林夜也不例外。", "他看着桌上的接入头盔，心里有那么一瞬间，确实掠过一个很荒唐的念头。既然连死后回档这种事都发生了，那开服以后，会不会连初始天赋都跟着改掉？会不会像那些论坛里常拿来开玩笑的重生小说一样，一睁眼就换了条命？", "这个想法刚冒头，林夜自己都想笑。", "他前世等《天灾》开服时，也和普通人没什么两样，刷帖子，猜职业，猜随机天赋，最多只是比别人多几分对未来的期待。后来他抽到的是A 级“稳弦”，效果很实在，能提高远程武器的稳定度和命中修正，放在弓箭手里算是很舒服的起步。可那也仅仅只是一个不错的起点，并没有直接把他抬进最顶层。", "他后面的路，更多还是自己一点点打出来的。", "所以林夜很快把那个近乎儿戏的幻想压了下去。想一想没什么，真要把行动建立在这种念头上，那就是自己给自己挖坑了。越是这种时候，越得先按最普通、最保守的情况做准备。", "如果他这一世还是原来的A 级天赋，那他开局该怎么打？", "如果怪物强度、任务奖励、基础掉率和前世存在细微偏差，他第一时间该先确认什么？", "如果青石村的那条偏线没有他记得的那么顺，甚至入口条件发生了变化，他又该怎么转向？", "这些问题，比“我会不会抽到逆天新天赋”现实得多。", "林夜起身整理桌面，把最容易碰倒的杂物拨开，只把等会儿真正用得上的东西留在手边。水，压缩饼干，葡萄糖片，备用数据线，营养剂，还有一只他前世吃过亏以后才知道重要的旧闹钟。", "《天灾》前期的恶意，很多时候不体现在大场面上，而是藏在这些很琐碎的地方。你以为只是少喝了一口水，少休息了十分钟，少补了点状态，问题不会太大。可在高强度开荒里，人一旦连续几个小时都绷着，手感、判断、耐性和专注度都会一起往下掉。那种亏，往往不是一场战斗输出来的，而是一整段节奏被拖垮出来的。", "他顺手点开官方公告，又把最初那几条接入说明从头扫了一遍。", "“首次接入过程中，若出现短暂眩晕、失重、方向感错位以及真实感强化，均属于正常反馈……”", "林夜的目光在“真实感强化”这几个字上停了停。前世他第一次看到时，只觉得官方在给全息沉浸感做宣传，甚至还有点夸张。可后来接入得越久，他越觉得《天灾》带来的那种真实感，和普通意义上的拟真不是一回事。尤其是到了后期，很多人都逐渐说不清自己到底是在玩一款游戏，还是在进入另一个本就存在的世界。", "这种念头现在还太远，远到没有讨论价值。", "林夜关掉页面，把视线重新落回头盔上。", "开服以后，他不会立刻去赌大的。", "他会先选最熟的人族和弓箭手，先接公开任务，先打普通怪，把怪物血量、掉落、手感和任务奖励重新摸一遍。等这些基础东西全部和记忆对上，他再切去自己真正想抢的路线。", "这听起来不够戏剧，也不够夸张。", "但林夜很清楚，真正能活到后面的玩家，靠的从来不是一上来就喊得最响，而是愿意先把脚下踩实。", "外面雨声渐渐小了，电子钟上的时间也一点点逼近零点。", "林夜低头看了眼自己的右手手背，那里安安静静，没有再出现任何异样。", "他忽然觉得这样也好。", "至少在结果真正落地前，他还能逼自己老老实实站在现实这边。"]},{"id": "004", "title": "零点将至", "time": "2041年7月17日 23:55至24:00", "location": "现实世界，江临市出租屋", "paragraphs": ["最后五分钟，整个论坛像烧开了一样。", "有人在刷自己花了多少钱升级设备，有人在猜首批主城会开放哪几座，也有人干脆开帖子直播倒计时，把一群同样睡不着的人都聚了进去。林夜随手翻了几页，在一堆兴奋和调侃里，看见几条不那么起眼的帖子。", "“你们有没有觉得登录界面盯久了有点发毛？”", "“我刚试了下设备，接入前的那一段白光看着怪怪的，像不是屏幕里的东西。”", "“不知道为什么，我总觉得不是我们去玩游戏，是游戏在等我们。”", "下面大多数回复都当成笑话看，顺手丢几个表情过去，说楼主是太紧张、太中二、或者单纯脑补过头。林夜看着这些内容，指尖在桌面轻轻点了一下，没有多留。", "前世这些帖子也有过，只是那时候的他根本没往心里去。", "如今再看，它们像是某种很早就冒出来的裂缝，只是当时谁都没有把它当回事。", "林夜关掉论坛，把椅背往后调了一格，重新坐稳。他把水杯放在右手边最顺的位置，把营养剂和压缩饼干摆好，确认房门反锁，手机静音，连窗户都只留了一条窄缝。动作不大，却一项都没省。", "这种准备谈不上多高深，可《天灾》前期开荒，本来就不是靠热血硬顶的事。尤其是弓箭手这类职业，对体力、专注和手感的要求比很多人想象中都高。你只要有一次走神，少看一眼怪的前摇，或者在体能下滑时还强撑着继续打，后果往往来得很快。", "林夜把头盔拿起来时，心里反而彻底静了。", "他知道今晚之后，整个世界都会变。至少在他前世的轨迹里，《天灾》从来不只是个现象级游戏。它会一步步侵入现实，改写规则，逼着所有人重新认识力量、资源、身份和生存。很多人一开始只把它当娱乐，过不了多久，就会发现自己已经没法从里面抽身了。", "但这些东西，现在都还没轮到。", "现在只是2041年7月17日的深夜，只是开服前最后几十秒，只是一个刚从死局里爬回来的年轻人，重新坐在了三年前的出租屋里，准备再一次推开那扇门。", "林夜把头盔戴好，眼前的现实景象被缓缓压暗。", "电子钟最后一次跳动。", "`2041年7月18日 00:00`", "下一刻，视野彻底黑了下去。"]},{"id": "005", "title": "SSS级复制", "time": "2041年7月18日 00:00后", "location": "接入空间，青石村", "paragraphs": ["意识被抽离现实的那一刻，林夜清楚地感觉到了一阵短促的失重。", "那种感觉和前世第一次接入时几乎一模一样，像整个人被从熟悉的空间里拔了出来，扔进一片没有上下左右的寂静里。片刻之后，前方才亮起一线白光，雾一样铺开，渐渐勾勒出接入空间的轮廓。", "“欢迎接入《天灾》。”", "系统声音自虚空中响起，平稳，清晰，没有任何多余情绪。", "林夜站在原地，目光先扫过最前面的种族界面。人族、精灵、山民、雾裔、石骨族，五个基础种族依次亮起。他几乎没有考虑，直接选了人族。这个选择不是为了保守，而是为了效率。人族路线最熟，主城选择多，前期通用任务链也最完整，能最快把他记忆里的优势兑现出来。", "职业选择紧随其后。", "战士、盾卫、刺客、法师、牧者、弓箭手。", "林夜的视线落在最后一项，没有丝毫停顿。弓箭手前期并不算最舒服的职业，伤害不算爆炸，容错也不高，真打起来还很吃拉扯和命中手感。可它是他前世最熟的一条路，很多东西已经刻进了本能里。重生之后，他最不该浪费的就是这种别人复制不来的经验。", "“职业确认：弓箭手。”", "很快，第三道界面浮现出来。", "“随机天赋觉醒中……”", "看到这行字的时候，林夜的呼吸还是不由自主地停了一拍。", "他之前压得再冷静，到了这一刻，也不可能一点波动都没有。毕竟所有玩家开局最大的变量就在这里。有人靠随机天赋一步起飞，也有人抽到偏门效果，前期只能咬着牙硬熬。前世他拿到A 级“稳弦”时，就已经算运气不错。", "光流在界面中央迅速汇聚，像一圈圈水波套在一起。就在那些符纹即将闭合的瞬间，林夜忽然看见白光里多出了一抹极细的银线。", "下一秒，他右手手背猛地灼了一下。", "不是之前那种一闪而过的热意，而像某种沉睡许久的东西终于被彻底唤醒。与此同时，一道并不属于标准系统播报的声音，在他耳边极快地掠过去。", "“最后一次推演修正完成。”", "林夜心口狠狠一震，甚至来不及细想，正式提示已经落了下来。", "“随机天赋觉醒成功。”", "“你获得：SSS级天赋【复制】。”", "界面定格的那一瞬，林夜整个人都僵住了。", "他不是没想过会有变数，可那种想法在开服前始终停留在“也许”这个层面上，更多时候甚至像是人在绝境里自我安慰的一点妄念。他刚才还在告诫自己，别先信天命，别把希望压在不切实际的幻想上。可现在，结果就这样硬生生砸到了他眼前。", "SSS级。", "复制。", "林夜盯着那两个字看了好几秒，胸口像被什么东西狠狠撞开，连指尖都跟着发麻。那种情绪不是简单的高兴，而是一种迟了太久、又突然落到实处的狂喜，来得太猛，以至于他一时间都说不出话。", "前世三年，他见过太多强天赋。", "加成夸张的，机制逆天的，天生适合某个职业的，能在版本前中期横着走的，他都见过。可“复制”这个名字，他一次都没听过。仅凭这一点，林夜就知道，这东西多半不是正常抽取池里会出现的天赋。", "他深吸了一口气，强行把情绪往下压，抬手点开详情。", "【天赋】  \n复制", "【品级】  \nSSS", "【说明】  \n你可复制目标天赋为己用。", "【当前复制位】  \n1/1", "【成长规则】  \n每提升10级，额外开启1个复制位。", "【提示一】  \n不同目标、不同品阶，复制条件不同。", "【提示二】  \n怪物、人类与特殊个体，均可能提供候选。", "【提示三】  \n候选出现后，你可选择复制，也可放弃。", "林夜一行一行看下去，眼底的光却渐渐沉了下来。", "这天赋很强，强得夸张，甚至可以说强得不讲道理。可它的强，不是那种一上来就把伤害、暴击、攻速全部抬起来的强。它更像一张上限极高、但前期极吃选择的成长型底牌。现在的他只有一个复制位，能用什么、什么时候用、要不要留给更大的机会，全部都是问题。", "换句话说，它给了他远高于前世的可能性，也把他推到了比前世更需要判断的位置上。", "想到这里，林夜反而真正冷静了。", "他很清楚自己为什么会这么快稳下来。因为他不是第一次面对诱人的选项，也不是第一次知道“越好的东西越不能乱用”这个道理。前世吃过的亏太多，已经够他把这份突如其来的狂喜压成行动力。", "角色创建完成后，基础面板在他眼前缓缓展开。", "【姓名】  \n林夜", "【种族】  \n人族", "【职业】  \n弓箭手", "【等级】  \n1", "【生命】  \n100/100", "【法力】  \n60/60", "【力量】  \n8", "【敏捷】  \n10", "【体质】  \n8", "【精神】  \n6", "【感知】  \n9", "【天赋】  \nSSS级 复制", "【复制位】  \n1/1（空）", "【初始装备】  \n训练木弓（白色-普通）", "训练短匕（白色-普通）", "训练箭矢 x40", "粗布上衣（白色-普通）", "粗布长裤（白色-普通）", "【初始技能】  \n无", "白得不能再白的标准开局。", "林夜看到这里，反而松了口气。这样才正常。如果系统真因为这个天赋直接给他一整套越级资源，那才叫麻烦。现在的局面虽然惊人，却还在他能理解的范围内。", "最后一行提示浮现出来。", "“是否进入初始区域：青石村？”", "林夜抬手按下确认。", "白光坠落的刹那，他没有去想什么一步登天，也没有急着幻想自己靠SSS级天赋横扫新手村。真正留在他脑子里的，还是开服前就定下来的那条顺序。", "先接任务。", "先打普通怪，把手感和版本确认清楚。", "再去看这份新天赋到底该怎么落地。", "下一刻，脚下终于传来坚实触感，四周的人声也像潮水一样轰然涌来。有人惊呼，有人大笑，有人原地试着跳跃奔跑，更多人则激动地盯着自己的面板，显然还没从刚进游戏的冲击里缓过来。", "这些人都在摸索。", "林夜却已经从最初那阵狂喜里抽了出来，抬脚就朝村长木屋和杂货铺的方向走去。", "他知道，真正的优势，从来都不是抽到一个天赋就结束了。", "而是从现在开始，把它一步步用对。"]}]; const chapterMap = new Map(chapters.map(ch => [ch.id, ch])); const chapterSelect = document.getElementById('chapter'); for (const ch of chapters) { const opt = document.createElement('option'); opt.value = ch.id; opt.textContent = '第' + ch.id + '章'; chapterSelect.appendChild(opt);} function getCurrentChapterId(){const params = new URLSearchParams(location.search); const raw = params.get('chapter') || chapters[0].id; return chapterMap.has(raw) ? raw : chapters[0].id;} function setNav(id){const index=chapters.findIndex(ch=>ch.id===id);const prev=chapters[Math.max(0,index-1)];const next=chapters[Math.min(chapters.length-1,index+1)];const prevHref='./index.html?chapter='+prev.id;const nextHref='./index.html?chapter='+next.id;document.getElementById('prev').href=prevHref;document.getElementById('next').href=nextHref;document.getElementById('prevBottom').href=prevHref;document.getElementById('nextBottom').href=nextHref;chapterSelect.value=id;} function render(){const id=getCurrentChapterId();const ch=chapterMap.get(id);setNav(id);document.title='第'+id+'章 '+ch.title+' - 《天灾》小说阅读';document.getElementById('title').textContent='第'+id+'章 '+ch.title;document.getElementById('chapterMeta').innerHTML='<div>时间：'+ch.time+'</div>'+'<div>地点：'+ch.location+'</div>';document.getElementById('content').innerHTML=ch.paragraphs.map(p=>'<p>'+p.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/`/g,'')+'</p>').join('');} chapterSelect.addEventListener('change',(e)=>{location.href='./index.html?chapter='+e.target.value;}); render();
  </script>
