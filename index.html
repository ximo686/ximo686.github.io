  <script>
    const chapters = [{"id": "001", "title": "裂谷回响", "time": "2041年7月17日 23:41", "location": "现实世界，江临市出租屋", "paragraphs": ["林夜醒来的那一下，胸口先疼得猛缩了一下。", "那不是普通做噩梦醒过来的发闷，更像有人刚刚把一截烧红的铁钉，从他肋骨缝里硬生生抽出去，留下来的痛还卡在肉里，没有完全散开。他下意识侧身，手掌几乎本能地往腰后摸，五指抓到的却不是短刀，也不是箭袋边缘，只有一团被压得发皱的薄被和一条已经有些起球的床单。", "动作做到一半，他整个人就僵住了。", "头顶那台老风扇还在转，扇叶带着一点轻微的晃，轴承转动时发出闷闷的嗡鸣。窗外有雨，雨点打在楼下铁皮棚上，噼里啪啦地砸成一片。空气很潮，带着夏夜屋子里常见的旧木气和一点被雨水泡过的灰尘味。房间不大，墙角堆着没拆完的快递箱，电脑桌边还搁着一桶刚吃了一半的泡面，面汤表面凝了一层浅浅的油星。", "所有细节都普通得要命。", "也正因为太普通了，林夜反而半天没动。", "前一刻，他明明还在黑裂谷最深处。", "那地方三年后在《天灾》里凶名极盛，往里走的人，十个有九个都会后悔。裂开的黑岩一层压着一层，地势乱得像被谁用巨斧劈过，脚下时不时还会塌。空气里常年漂着一层灰黑色的湿雾，闻不出怪味，可伤口一旦沾上，就会像被细针扎进肉里一样发麻发烫，药剂灌下去都压不住。林夜最后是被人一路逼进去的，那时候他箭袋早就见底，左肩也挨过一刀，血顺着护臂往下淌，后面那群人却不着急收尾，只是把他的退路一条条封死，像赶一头已经受了伤的狼，慢慢往最深的地方赶。", "他到现在都还记得其中一人的声音，带着一点说不出的轻慢笑意。", "“别急着弄死，往里赶。”", "“他脚下那条路，正好替我们先踩一遍。”", "林夜闭了闭眼，喉咙里那股血腥味像是又翻了上来。他记得自己最后踩空了一截断岩，也记得右手在石壁旁摸到了一块冷得刺骨的东西。那玩意儿表面全是裂纹，像一块已经用到快碎掉的灰白石头，偏偏石心深处透着一线极细的光，冷意几乎扎进骨头里。他那时候根本来不及分辨那到底是什么，后面的追兵已经压近，裂谷深处那股一直不声不响的黑雾也像突然活过来似的往上翻。他只记得自己把那块石头死死攥在掌心里，下一瞬，所有感官都像被谁一把扯裂。", "等再睁眼，人就在这张吱呀作响的旧木床上了。", "林夜撑着床沿坐起身，膝盖撞在床角，疼得他眉头一跳。这点清清楚楚的痛，反倒让脑子往回落了一寸。他低下头，看了看自己的手。手背干净，虎口平整，指腹也还只是年轻人正常的粗糙，并没有后来那层长年拉弓磨出来的厚茧。三年后的他，右手食指侧面会裂，左前臂内侧常年勒着护臂印，阴雨天一到，整条右臂连带肩背都会跟着发酸。", "现在这双手，不是三年后的。", "他起身走到桌边，按亮了电子钟。", "`2041年7月17日 23:41`", "那串数字一跳出来，林夜整个人都沉默了。", "不是看不懂，也不是不敢认，而是那一瞬间，脑子里所有还在来回撕扯的怀疑，忽然都被这一行时间硬压住了。这个夜晚他当然记得。因为再过十九分钟，《天灾》就会正式开服。这个后来把整个世界都搅得天翻地覆的名字，在眼下仍旧只是一款所有人都在盯着倒计时等上线的全息游戏。", "林夜缓缓吐出一口气，视线挪到桌面另一侧。银灰色的接入头盔安安稳稳摆在那里，旁边的电脑还亮着，页面停在《天灾》的官方界面上。猩红色倒计时一秒一秒往下掉，安静得近乎冷酷。", "`00:18:19`", "他盯着那串数字看了很久，胸口那股从醒来到现在都没散掉的绷紧，终于慢慢有了个落处。", "他大概真的回来了。", "这个念头浮起来的时候，心里最先炸开的并不是喜悦，而是一股近乎发麻的空白。太突然了，突然到人甚至来不及高兴。黑裂谷里的灰雾、血味、石壁和脚底塌空的失重感全都还挂在骨头缝里，眼前的出租屋却又真得挑不出一点破绽。林夜在原地站了一会儿，才转身走进卫生间，拧开水龙头，把冷水一把把往脸上拍。", "镜子里的人年轻许多，眼下带着熬夜的青，头发还有点乱，怎么看都只是个等着开服的普通青年。可只有林夜自己知道，那双眼睛已经和以前不一样了。三年里在野外熬出来的东西，不会因为一身皮肉被硬拉回年轻的时候，就跟着一起消失。", "他弯下腰，双手撑在洗手台边，等那阵急促的心跳稍稍缓下来，才重新抬头看向镜子里的自己。就在这时，右手手背忽然掠过一阵极轻的灼意，像是有一根极细的银针顺着皮下快速划了一道。林夜立刻低头，只来得及看见一缕极淡的银白纹路从皮下浮起，又很快沉回去，快得像一场错觉。", "他盯着那块皮肤看了几秒，什么都没碰，只是慢慢把手收紧。", "至少有一件事，已经不需要再怀疑了。", "无论那块石头到底是什么，黑裂谷里那一下，确实把他从死局里拖了回来。而现在，距离《天灾》开服，只剩十九分钟。"]}, {"id": "002", "title": "回生十九分", "time": "2041年7月17日 23:41至23:59", "location": "现实世界，江临市出租屋", "paragraphs": ["水流顺着下巴往下滴的时候，林夜总算把那股像钉在胸口的窒闷感压下去一点。", "他没立刻回床边，而是先站在卫生间里，听了几秒窗外的雨声。那声音比黑裂谷里那种死寂好太多，也因此显得格外不真实。人被逼到死路上时，脑子里会有很多乱七八糟的念头。林夜现在就很清楚地感觉到，那些念头还在，像被烧过以后留下来的残火，一碰就能再蹿起来。", "最先往上翻的自然是恨。", "那股恨太具体了，具体到某一句话、某一个人站的位置、某把刀是从什么角度劈过来的，他都还能记得清清楚楚。可也正因为记得太清楚，他反而比谁都明白，现在绝不能顺着那股劲走。前世他见过太多这样的人，吃了亏，受了辱，脑子里只剩一口要讨回来的气，明明还没站稳，就先往旧仇上撞，最后人没报成，反倒把自己再次送进坑里。", "重来一次，要是还这么死，那就不是不走运，是活该。", "林夜抬手把脸上的水抹掉，走回桌边坐下，强迫自己把注意力压回眼前。电脑屏幕上的倒计时还在一秒秒往下走，官方论坛却已经热闹得像开了锅。新帖刷得极快，职业分析、天赋猜想、主城预测、游戏细节爆料，还有一堆半真半假的设备体验贴，全都挤在首页。林夜随手翻了几页，心里却没有太多波动。", "他上一世也是这么过来的。", "那时候的他也会盯着帖子看，猜自己会是什么职业开局，天赋能不能和弓箭手搭上边，青石村这样的新手区到底藏没藏偏门路子。后来三年打下来，他才慢慢明白，开服那一夜真正值钱的，从来不是你在论坛里看过多少“攻略”，而是你能不能把最开始那段时间差稳稳吃到嘴里。早半小时接上任务，早一步摸清怪物动作，早一点把第一轮铜币、箭矢和白装攒起来，很多差距就是从这些看起来不起眼的地方开始滚起来的。", "林夜把椅子往前挪了点，双肘压在桌边，闭上眼，把脑子里那些真正有用的东西往外拎。", "他不是全知。", "这一点他始终很清楚。前世最强的时候，他也不过是一线边缘的高玩弓箭手，野外经验够深，打架够稳，地图感和路线感都很强，可真要说触到了《天灾》最深那一层，他根本没那个资格。很多最本质的真相，很多更高层势力到底在争什么，他都只看见了影子。", "可反过来说，他知道的也绝不少。", "青石村哪一片怪更适合弓手练手，哪一类公开任务给的铜币最实在，哪些怪的掉落前期看着鸡肋，过一段时间却会因为副职业和药剂线突然涨起来，哪一条偏路早年被绝大多数玩家嫌麻烦、后面却被证明值钱，这些东西，他脑子里都还有印子。不是那种背答案一样的死记硬背，而是一路吃亏、一路追赶，最后硬生生磨出来的直觉。", "想到这里，林夜的视线忽然落在桌边那顶头盔上，脑子里掠过一个近乎荒唐的念头。", "既然连死后回到开服前夜这种事都发生了，那这一世的开局，会不会连随机天赋都跟着改？", "这个念头出现得很快，压下去也同样快。", "不是林夜不想，而是他太清楚这种想法有多危险。人一旦把事情往“天命都站在我这边”去想，后面很多判断就会不自觉地浮起来，脚也会跟着飘。他现在最该做的，恰恰是先按最普通、最保守的情况准备。哪怕进游戏以后，他还是前世那个A 级起步，哪怕一切都没有额外变化，他也照样能靠前世经验先把第一步抢出来。", "这才是稳路。", "林夜把桌面能用上的东西重新理了一遍。水、葡萄糖片、压缩饼干、备用电源、营养剂，还有一只声音不大的旧闹钟，全都摆到最顺手的位置。很多人觉得这种准备小题大做，可真进过《天灾》前期开荒的人都知道，弓箭手这种职业从来不是只吃面板。状态、注意力、手感和补给，有时候比多几点攻击还要命。你少喝一口水，晚补一回药，或者硬撑着困意继续打，前面好不容易抢出来的节奏，很可能就在一个小时以后全塌掉。", "东西摆妥以后，林夜又把官方最开始那份接入说明重新翻出来，从头到尾看了一遍。", "那份说明前世他见过不止一次，当时只觉得大部分都是宣传话术。现在重新看，意味却完全不同。尤其是那一句，“首次接入过程中，若出现短暂眩晕、失重、方向感错位以及真实感强化，均属于正常反馈。”", "真实感强化。", "林夜盯着这几个字看了几秒，眉头一点点皱起来。前世最开始谁都没把这句话当回事，大家只觉得这游戏拟真做得够狠。可越往后走，越多玩家私下里提同一句话，他们会慢慢说不清自己到底是在玩一款游戏，还是在被拖进另一个本来就存在的世界。", "这种念头现在还太远，林夜也没法往深处想。可他知道，这句话既然又一次摆在他眼前，就说明那股不对劲从一开始就不只是错觉。", "倒计时已经跳到最后一分钟。", "林夜把所有能想到的都压了一遍，心反而慢慢静下来了。他知道自己接下来该怎么走。进游戏之后，先选最熟的人族和弓箭手，先接最基础的公开任务，先打普通怪，把怪物动作、掉落、经验、任务奖励和地形细节重新核一遍。只要这些基础东西和记忆对得上，他就能把脚下这条路继续往前接。", "至于别的，无论是天赋有没有变，还是后面有没有更多异样，都等它真正落到眼前再说。", "林夜抬手拿起头盔，扣到头上的时候，电子钟刚好跳到 `23:59`。雨已经小了，楼下偶尔还有轮胎压过积水的声音，整座城市仍旧和往常没什么区别。", "可他知道，零点一到，很多东西就再也回不去了。"]}, {"id": "003", "title": "白光之后", "time": "2041年7月18日 00:00至00:19", "location": "青石村，新手接引广场与村口任务区", "paragraphs": ["零点一到，林夜先感到的是失重。", "像是有人忽然从背后把整块地板抽空了，身体往下一沉，耳边却没有风声，只有一阵极轻的嗡鸣压过来，远得几乎听不清，又近得像是贴着头骨在震。那种感觉只维持了几秒，等脚底重新有了实感时，他闻到的已经不是出租屋里潮闷的旧木味，而是草叶、泥土和火把燃烧后残下来的浅淡烟气。", "他睁开眼，眼前是一片被火光照亮的石砖广场。", "广场不算大，四周竖着粗木栅栏，远处隐约能看到低矮木屋和一圈圈还没完全散开的炊烟。林地和山影被夜色压在更远处，风从那边吹过来，带着一点很鲜明的湿凉。脚下石砖的硬度、空气里草木的味道、火把明暗不稳的跳动，全都真得过了头，真得让人一时分不清自己到底是在进游戏，还是被什么东西整个人拖进了另一个地方。", "周围很快炸开一片声音。", "有人在骂，有人在笑，有人还在原地发愣，像被这份真实一下子砸懵了。一个戴眼镜的青年正蹲在地上捻石缝里的泥，嘴里连着说了三遍“这不对吧”；不远处还有人伸手去摸木桩，像想确认自己是不是还在全息演示里。林夜把这些动静全都甩在耳后，目光直直落向自己面前那层刚刚浮起的半透明界面。", "【欢迎进入《天灾》】", "【当前区域：青石村】", "【请完成初始身份确认】", "和前世一样。", "这一下，林夜心里最后那点浮悬也跟着落了下来。他没有浪费时间去看那些外观微调选项，直接把种族定在人族，职业落在弓箭手上。", "这一条路，他太熟了。", "熟到哪怕隔着三年再回来，很多东西也依旧像印在身体里。弓箭手前期难受，这一点没人比他更清楚。脆，缺爆发，箭矢和药水全是硬消耗，走位稍有不顺就会被贴脸，想打得舒服，往往得靠比别人更多的耐性和更细的手感去换。可也正因为他知道这些难处，所以才更不可能在这种时候换路。重来一次，最要紧的是把记忆和手感尽快接回身体，而不是逞一时新鲜。", "职业定下以后，剩下的就是天赋。", "和论坛里无数人猜测的一样，随机天赋并没有给人挑选机会。界面中央的光慢慢聚起来，从最低的 `F` 一路往上跳。广场上的声音随着那道光的变化忽高忽低，像无数人的心也被一起吊了上去。等评级掠过 `S` 的时候，旁边已经有人失声叫了出来，显然是抽到了足够让他狂喜的高阶天赋。", "林夜却连眼睛都没眨一下，只死死盯着自己面前那道还没停住的光。", "下一瞬，光芒猛地一震。", "三个银白色字符静静亮起。", "`SSS`", "林夜整个人都定住了。", "那感觉很难用一句话说清。像是心脏忽然被谁攥住又猛地松开，所有血一下冲上头顶，连指尖都跟着发麻。前世三年，他不是没见过高阶天赋，可那种东西距离大多数人都太远，距离开服时的自己更远。现在它就这么安安静静地停在眼前，停得林夜一时间竟连呼吸都慢了一拍。", "紧跟着，新的提示一行行展开。", "【天赋觉醒成功】", "【天赋等级：SSS】", "【天赋名称：复制】", "【当前复制位：1】", "【说明：你可从符合条件的目标身上获取天赋候选，并占用复制位完成复制。每提升10级，额外开启1个复制位。】", "【当前稳定复制上限：SS级及以下】", "【备注：复制位可替换，但替换存在冷却与消耗。】", "林夜从头到尾看完，胸口那股刚刚还在横冲直撞的热意，反倒慢慢沉了下来。", "不是因为他不激动了。", "恰恰相反，是因为看到这里，他终于意识到这东西和自己第一眼想象的不一样。复制当然强，强得夸张，强得到现在站在广场上的任何一个玩家知道了，都会疯了一样盯着他看。可这份强并不是“开局直接无敌”。一格复制位，十级才再开一格，初始上限稳定到SS，还是“可替换但有冷却”。这说明至少在眼下，它不是拿来让他见什么吃什么的。", "更要命的是，林夜自己也不知道它后面到底该怎么用。", "这一点在最初的激动过去以后，反而让他瞬间冷静了很多。因为问题已经很清楚地摆在这儿了。他现在不是已经拿到了一套完整答案，而是只拿到了一扇门。门后当然有极惊人的东西，可你第一步往哪踩，踩错了会不会把自己先卡住，他这会儿根本说不准。", "林夜站在原地，盯着那几行说明又看了一遍，甚至连“复制位”“可替换”“冷却”“消耗”这些字眼都在心里慢慢掂了一遍。若是普通时候，他或许还会顺着这份兴奋往更远处想，猜一猜自己将来能不能靠这东西把前世那些顶尖人物都甩开。可现在不行。开服第一夜，最值钱的还是脚下这几分钟。真把脑子耗在原地，对这份天赋也没有半点好处。", "他深吸了一口气，强迫自己把视线先往下压。", "初始面板随之展开。", "```text\n【姓名】：林夜\n【等级】：0\n【当前经验】：0/60\n【职业】：弓箭手\n【生命】：100/100\n【法力】：40/40\n【力量】：5\n【敏捷】：7\n【体质】：5\n【精神】：4\n【感知】：7\n【天赋】：SSS级·复制\n【技能】：无\n【装备】：新手短弓、新手布衣、练习箭矢x30\n【货币】：0铜 0银 0金\n```", "基础模板和前世几乎没差。典型的新手弓手，敏捷和感知略高，力量、体质都只够勉强开局，法力也少得可怜。真要被近身，依旧会被啃得很难看。换句话说，哪怕头顶挂着一个 `SSS`，眼下这副身板也照样没资格乱来。", "林夜刚把面板往下拉了一点，视野右下角忽然浮起一行极淡的灰白小字。那行字和周围所有系统提示都不太一样，像有人隔着更深一层的地方，往他这里轻轻投来一道目光。", "【最后一次推演已接续】", "林夜眼神一沉，还没来得及细看，那行字就散掉了，快得像从没出现过。", "周围的喧哗还在持续，甚至比刚才更大了。有人抽到低阶天赋，脸色难看得跟赔光了家底似的；也有人因为拿到一条还算顺手的功能型能力，站在原地和身边人兴奋地猜后面该怎么走。广场另一头，一个身形高壮的青年被一圈人围着问东问西，显然是开到了足够亮眼的战斗天赋，整个人都压不住那股得意。", "林夜从头到尾都没有多看他一眼。", "因为看到这里，他已经彻底想明白自己接下来第一步该做什么了。", "不是站在原地把 `SSS级·复制` 这几个字反复咀嚼，也不是立刻把自己想成什么天命开局的特殊人物。越是这种时候，他越要先按最稳的路走。先去接基础任务，先打普通怪，先把怪物动作、掉落、经验、任务奖励和地图细节都重新核一遍。然后在这个过程里，一点一点去试，去看，去把“复制”这东西真正会怎么运作摸出来。", "只有这样，才像他。", "也只有这样，这份夸张到吓人的开局，才不会被他自己先用废掉。", "林夜关掉面板，伸手把新手短弓从背后摘了下来。弓身不重，甚至有点轻飘，这种手感放到后面只会让人嫌弃，可现在握进掌心的那一刻，他心里反倒定了。", "无论天赋怎么变，路都得从村口第一只怪开始走。", "想到这里，他再没有半点多余犹豫，转身就朝村口任务区走去。别人还在原地适应和震惊的时候，他已经决定用这最普通的一步，去把那份最不普通的天赋，先摸出个明白来。"]}, {"id": "004", "title": "村口试弓", "time": "2041年7月18日 00:19至00:43", "location": "青石村村口、菜地外坡地", "paragraphs": ["青石村村口比广场还乱。", "刚进来的玩家几乎都在往这边挤。有人围着村长问职业，有人急着找杂货铺，也有人什么都不懂，只知道跟着人多的地方跑。夜里的火把还没换，光有些晃，照得一张张新手的脸忽明忽暗。林夜从人群边缘穿过去时，甚至还能听见有人在大声和同伴争，说弓箭手前期肯定废，盾卫才是稳路子。", "这种争论他前世听过太多，连停一下的兴趣都没有。", "他来村口不是为了听这些。真正先手的东西，永远不在嘴上。", "村长是个头发花白的老头，背微驼，嗓子也沙，偏偏耐心还不错，被十几个人围着也没当场发火。林夜没往最里面挤，只在老头刚把一个问了半天也没问明白的年轻人打发走以后，往前递了一句。", "“老丈，村外是不是缺人手？”", "村长抬头看了他一眼，目光不算锋利，却很稳，像先用眼把你掂了一掂，才慢慢开口：“缺。南边菜地外头那群灰尾兔闹得厉害，苗拱了不少，还钻晒场。你要是肯搭把手，就替我收一收。别图快乱跑，带六条兔尾回来，我也好记数。”", "系统提示无声展开。", "【是否接受任务：清理灰尾兔】", "【任务要求：击杀灰尾兔6只，并带回灰尾兔尾x6】", "【任务奖励：经验18点，铜币8枚，练习箭矢x10】", "林夜直接接下。", "这就是他想要的第一类任务。奖不大，却稳，尤其那十支练习箭，对新手弓手来说比很多花里胡哨的东西都实在。前期开局要是连箭都补不顺，后头再好的路线都容易中途断气。", "他没立刻出村，又顺手去杂货铺那边看了一眼。守铺子的是个四十多岁的妇人，手脚利索，说话也快，正一边收拾柜台一边骂村口那帮新手踩脏了她刚晒好的麻绳。看到林夜停下，她先上下打量了他一眼，随后才把口风收住一点。", "“要出村？”", "“嗯。”", "“那顺手帮我把草坡边那几截旧麻绳捡回来。”她说着拿下巴往外一点，“刚才那群兔崽子乱窜，拖得满地都是。我这边忙不开，你带回来四段，我给你一块面包，再添一点零碎铜子。”", "这话说得就比村长那边更像活人说话，带点烦，也带点图省事的直白。林夜听完便点头应下。", "【是否接受任务：寻回旧麻绳】", "【任务要求：寻回旧麻绳x4】", "【任务奖励：经验10点，黑麦面包x1，铜币1枚】", "一攻一辅，两条线正好压在一片区域里，顺手都能做。这种任务最不起眼，也最容易被刚进来的玩家看轻。可林夜心里清楚，真正会过日子的新手弓手，就是靠这些一点点把开局撑起来的。", "走出村口以后，外面的视野一下子松开了不少。", "菜地外是连着起伏的浅坡，草不深，地上却散着碎石和半干的泥块。再往远处一点，就是一道雾气还没完全散开的林线。林夜站在坡边，先没急着乱走，而是把短弓从背后摘下来，试着拉了两次弓弦。", "很轻，轻得甚至有点空。", "这种弓后面根本不够看，可眼下它却足够重要。因为林夜要靠它做的不是打出多高的伤害，而是先把这副年轻身体和那种阔别三年的出手感重新接起来。怎么站，怎么送肩，怎么让视线先落在怪的动作上，再去找箭该落的位置，这些东西不是靠“记得”就能立刻恢复的，得真打出去才行。", "草坡里很快有了动静。", "一只灰尾兔从菜垄旁边窜出来，耳朵支得很直，鼻头一耸一耸地动，看到林夜时还往前试探了两步，像根本没把这名新手弓手当回事。", "```text\n【灰尾兔】\n【等级】：1\n【生命】：80/80\n【技能】：前扑\n【说明】：青石村外围最常见的小型怪，胆子不大，却很会借草丛乱窜。\n```", "林夜盯着它看了两秒，没有急着开弓。", "这是他进《天灾》后真正意义上的第一只怪。哪怕眼前这东西弱得近乎可笑，他也不想把第一箭射得太轻率。灰尾兔前扑前，后腿会先压一下，耳朵也会稍稍往后伏。这个动作他前世不知道见过多少次，可现在真看到那一下压腿时，心口还是像被什么轻轻撞了一下。", "熟悉感回来了。", "箭出。", "-22。", "木箭扎进灰尾兔肩侧，那东西被打得一偏，落地后立刻红了眼，四肢一蹬就往左前方乱窜。林夜脚下先跟半步，再收，不追着它跑，只等它自己把扑线送出来。果然，灰尾兔乱窜半圈以后猛地回扑，林夜侧身让开，第二箭顺势补出去。", "-25。", "血线一下压过半数，灰尾兔扑空之后动作已经开始乱。林夜没有再拖，第三箭直直送进它颈侧。", "-37（弱点）", "灰尾兔翻了两下，终于没了动静。", "系统提示随之跳出。", "【击杀灰尾兔，获得经验8点】", "【获得：灰尾兔尾x1】", "【获得：兔肉x1】", "没有惊喜，也没有花样，和前世一样普通。可林夜站在原地，看着那具很快开始散掉的怪尸，心里却慢慢稳了下来。不是因为这一只兔子有多值钱，而是因为这一箭一箭打出去时，他忽然很清楚地意识到，自己上一世在野外磨出来的那些东西，并没有因为重来一次就断干净。", "手还在。", "眼也还在。", "只要这些东西还在，他后面那条路就不会从头再走一遍。", "林夜弯腰把掉落收起来，顺手把箭拔回箭囊里，随后抬头看向更东边那道雾色稍重的林线。前世很久以后，他才知道那边藏着一条值钱得过分的暗路。现在它还安安静静地躺在那里，没人去碰，也没人看得上。", "想到这里，他反而不急了。", "真要去抢那条路，也得先把眼下这几步走稳。至少这一刻，林夜已经重新找回了最重要的东西。他知道自己该怎样继续出箭，也知道自己这一世，确实有机会把那些错过的东西提前攥进手里。"]}, {"id": "005", "title": "兔尾与铜币", "time": "2041年7月18日 00:43至01:24", "location": "青石村菜地外坡、回村路", "paragraphs": ["第一只灰尾兔倒下以后，林夜并没有立刻去看更远的地方。", "他把箭收回箭囊，低头掂了掂那条兔尾和那块还带温热的兔肉，随后抬眼扫了扫周围的草坡。菜地外这一片怪刷得快，地也算开，的确是最适合新手弓箭手找手感的地方。问题在于，这种地方适合的不止他一个。刚才还空着的坡地，这会儿已经陆续有人往外压了，远处不时能听见箭射偏以后落进草里的闷响，也能听见有人追着兔子跑，边跑边骂。", "林夜看了两眼，心里没有半点想笑的意思。", "因为他太清楚，这就是大多数人刚进《天灾》时最正常的样子。真实感一上来，很多旧游戏里被简化掉的东西全回来了。怪会乱窜，地会滑，角度不对，箭就真会空。你以为一只一级小怪不值一提，可真要在开服第一夜就靠弓箭手吃饭，很多人会先被这种最基础的东西狠狠干一顿。", "林夜把注意力收回来，继续沿坡往前。", "接下来的几只灰尾兔，打得就比第一只更顺。不是因为怪变简单了，而是他的身体正在一点点把那种旧节奏重新拾起来。前扑前的后腿收缩、窜逃时的习惯转向、受伤后最容易乱掉的那一拍，全都渐渐变回了熟悉的东西。林夜甚至能感觉到，自己很多时候不是在想，而是看见怪动的同时，手脚已经先把位置让出来了。", "六只兔子收完，任务要的兔尾也齐了五条，经验条也悄悄涨了一截。可林夜没有着急回村，因为杂货铺妇人要的那几段旧麻绳还没找全。他沿着草坡边慢慢绕，边走边顺手再清怪。路上碰见一只从菜垄后冲出来的灰尾兔时，对方甚至没来得及完整扑出去，就被他一箭钉在肩背上，第二箭随即补死。", "经验条在这一刻终于撞过了门槛。", "【经验已满，等级提升】", "【当前等级：1】", "那股升级时特有的暖意从胸口缓缓散开，肩背、手臂和双腿都像被重新抻顺了一遍。林夜没有立刻沉浸在这种轻微却清楚的提升里，而是先把面板拉开，看了一眼最实际的变化。", "```text\n【姓名】：林夜\n【等级】：1\n【当前经验】：3/100\n【职业】：弓箭手\n【生命】：110/110\n【法力】：45/45\n【力量】：6\n【敏捷】：8\n【体质】：6\n【精神】：4\n【感知】：8\n【天赋】：SSS级·复制\n【已复制天赋】：无\n【技能】：无\n【装备】：新手短弓、新手布衣、练习箭矢x24\n【货币】：0铜 0银 0金\n```", "这就是最标准的新手提升。", "涨得不多，可每一点都很实在。血更厚一截，敏捷和感知又往上抬了一点，至少意味着接下来的拉弓和走位会比刚进游戏那会儿再顺些。可林夜心里也同样清楚，这点提升远远不够他浪。别说东林那条暗线，现在就算遇上稍微难缠一点的强化怪，他也一样得掂量。", "他把面板关掉，继续找那几段麻绳。没过多久，终于在一丛被踩歪的灌木底下摸到了最后两段。麻绳边上还散着两块被啃过的萝卜头，显然真是被那帮灰尾兔拖出来的。", "回村的路上，林夜顺手清点了一下背包。六条兔尾，七块兔肉，一撮能卖钱的兔皮毛，外加一件刚从兔子身上爆出来的白装护腕。东西不多，却是开服第一夜最正经的那种收成。", "那件护腕更是典型。", "```text\n【粗布护腕】\n【装备等级】：1\n【装备品质】：白色·普通\n【装备部位】：手腕\n【属性】：体质+1\n【说明】：用厚布和麻线缝成的简易护腕，谈不上结实，但比空着强。\n```", "白装放到后面根本没人看一眼，可眼下它依旧有意义。特别是这种正好卡在自身等级上的过渡装，穿上就能把属性吃满，不需要任何额外代价。林夜当场把护腕换上，手背上那点轻飘飘的空感顿时少了一丝，哪怕只是心理上的，也总比没有好。", "回村以后，村长数兔尾数得很仔细，数到第六条才把袋子系上，递过来时还看了林夜一眼。", "“腿脚倒挺稳。”老头把装铜币的小布袋搁到柜台上，语气比先前缓和了点，“这会儿会做事的不多。拿着，箭也带上。别以为村外那几只兔子好打，就真当外头都是给人练手的。”", "林夜点点头，把东西收了。", "【完成任务：清理灰尾兔】", "【获得经验18点】", "【获得铜币8枚】", "【获得练习箭矢x10】", "随后他又去了杂货铺。那妇人正站在门口捆一袋豆子，看见林夜真把四段旧麻绳带回来了，脸上的不耐才散了点。", "“还行，没白说。”她把一块黑麦面包塞过来，又摸出一枚铜子拍到柜台边，“拿着。下次要是再经过南坡那边，替我看看有没有鸡羽掉进沟里。不是多值钱的东西，就是总得有人去捡。”", "她说得快，语气里却带着那种过日子人的顺手和盘算，不像任务板子，也不像系统提示。林夜接过面包和铜子时，甚至能从那一点点抱怨里听出些许真实日常的疲惫。", "【完成任务：寻回旧麻绳】", "【获得经验10点】", "【获得黑麦面包x1】", "【获得铜币1枚】", "零钱落袋的声音很轻，林夜心里却因此更稳了几分。", "九枚铜币。", "这点钱放到后面连一瓶像样的恢复药都买不来，可在青石村，它就是补给，就是下一段路还能不能继续往前滚的底气。很多人一开始只盯着怪和等级，看不上这几枚铜板，等箭矢断了、药买不起、修理也舍不得时，才知道自己前面漏掉的都是什么。", "林夜把黑麦面包掰了一半，站在村口慢慢吃完，又喝了两口水，才重新往外走。走到半坡回望时，东边那片雾林依旧安静，像一条还没开口的暗线，等着他什么时候真正有余力再去碰。", "可就在他准备收回目光的那一刻，坡地另一头忽然动了一下。", "一只灰尾兔从石坡后方慢慢走出来，体型明显比普通个体大了一圈，背上的灰毛里还夹着一层更深的暗色，耳朵也不是普通那种细长立起的形状，而是略略往后压，眼神里带着一股不太像兔子的冷意。", "林夜脚步顿住，眼神也跟着收紧。", "普通怪打到现在为止，村口这块地方该给他的，差不多都给完了。眼前这只东西，才像是下一步真正值得他去摸一摸规则的目标。"]}, {"id": "006", "title": "灰白候选", "time": "2041年7月18日 01:24至02:03", "location": "青石村东侧草石坡", "paragraphs": ["那只兔子一出来，周围一下子安静了些。", "不是村口那边真的静了，而是林夜自己的注意力被收得很紧。草石坡这片他前面已经来回打了好几轮，普通灰尾兔会怎么窜、会怎么扑，心里早有数。眼前这只却明显不一样。它背上那层暗灰色毛更粗更硬，后腿压得也更低，站在那里时没有普通兔子那种一惊一乍的躁，而是一股随时都能蹿起来的绷劲。", "系统信息很快浮了出来。", "```text\n【灰背迅兔】\n【等级】：2\n【生命】：145/145\n【技能】：急窜、前扑\n【说明】：青石村外围偶尔出现的强化个体，速度和爆发明显高于普通灰尾兔。\n```", "林夜看完说明，反而没急着开弓。", "前面那些普通怪只是让他重新找回手，真正要试“复制”会不会有动静，至少也该是这种东西。可也正因为它比普通怪高了一层，越不能像打兔子一样抬手就射。速度型强化怪最会钻的就是远程职业起手那一瞬间的空门，一箭没压住，后面很容易整段都乱。", "他先看地形。", "左边那片碎石不能踩，太滑；右边低灌木不算高，却正好能挡一挡急窜后的折返线；正前那块半埋的矮土包最值钱，兔子要是从这个角度扑过来，落地后刚好会被卡一拍。", "这些东西看清了，林夜才慢慢抬弓。", "灰背迅兔耳朵一抖，整只怪几乎在同一时间压低身体冲了过来。和普通灰尾兔那种显眼的前扑不同，它第一下更像在贴地滑行，十来米距离一瞬间就短了一半。林夜没有往后缩，而是借着那道矮土包往右斜切半步，人在动，弓也一起开，第一箭几乎擦着自己肩线送了出去。", "-19。", "箭中前胸，灰背迅兔被撞得歪了一点，却没有像普通怪那样直接翻开，反倒借落地惯性横掠出去，身形在草石坡上一闪，第二次急窜几乎紧跟着就来了。", "这一下才是它最烦的地方。", "新手第一次碰见这种怪，往往第一箭刚打中，心里还没来得及稳住，第二下就已经贴脸了。林夜却像早就在等这一脚急窜，脚底往后错开一点，整个人顺着兔子折返的方向往外抽。那道灰影几乎贴着他的膝弯擦过去，第二箭也在这一刻甩了出去。", "-28。", "这一箭正中后腿根部。", "灰背迅兔吃痛，动作终于乱了半拍，血线也被一下拉到一半以下。它落地之后发出一声短促尖叫，红着眼就往回扑。林夜这一次没退太多，只在扑线真正压到面前时往旁边让开身位，让它一头撞在那块半埋的土包边缘上，随后第三箭稳稳压进颈侧。", "-32。", "伤害一出来，灰背迅兔已经只剩最后一截血。它还想借最后一点力气往外再窜，林夜却没给它这个机会，短匕顺着它冲过来的方向一顶，再补上一箭，战斗很快收尾。", "-15。", "-39（弱点）", "兔尸翻出去半圈，抽搐两下，终于不动了。", "林夜站在原地，慢慢把呼吸吐干净，后背已经起了一层薄汗。他很清楚，自己这一场赢得不算轻松。不是技术不够，而是这副一身白板的低级弓手面板，和真正能把动作稳稳做出来的身体强度之间，终究还差着一层。可也正因为如此，这一战反而更有价值。它让林夜重新摸清楚，自己如今这副身板，打到什么程度会开始真正吃力。", "系统奖励随之跳出。", "【击杀灰背迅兔，获得经验24点】", "【获得：兔肉x2】", "【获得：迅兔后腿肉x1】", "【获得：铜币2枚】", "【获得：轻皮束带x1】", "这些掉落都正常，和强化普通怪的层级对得上。多一点经验，多两枚铜币，再加一件过渡白装。林夜刚弯腰去收东西，视野中央便忽然亮起一道很淡、很安静的灰白界面。", "和系统常规提示不一样，它没有那么硬的边，也没有那种人人都能看见的亮度，像是从灰背迅兔散开的尸影里慢慢浮出来的一层薄雾，只有林夜自己能看见。", "```text\n【可复制候选】\n【目标】：灰背迅兔", "【候选一】：E级·弹跃\n【效果】：短时间内弹跳能力提升10%。", "【候选二】：D级·短促爆发\n【效果】：短距离瞬间冲刺能力提升20%，持续时间极短。\n```", "林夜盯着那几行字看了几秒，呼吸也微微停了一下。", "终于出来了。", "不是一句模糊到像错觉的倾向提示，而是一份真正能落到手上的候选。更关键的是，这一层东西只在他眼前亮着。离他不远的坡下正好有两个新手也在打怪，其中一个往这边张望了一眼，目光里只有对强化怪掉落的羡慕，根本没有半点察觉。", "这就够了。", "复制不是全体玩家共享的暗规则，它确实只认他一个人。", "可兴奋归兴奋，林夜心里那股热意并没有顶太久。因为他很快就看清了眼前这两份候选的分量。", "E级弹跃太浅，只能算聊胜于无。D级短促爆发看上去更实用，尤其对前期赶路、抢位和近距离拉扯来说，确实会舒服很多。真要换一个刚进游戏的人站在这里，八成已经按下去了。可林夜没有。", "他不是看不上这条候选。", "恰恰相反，正因为它有点用，他才得更清醒。第一格只有一个，替换还有冷却，这种时候把位子给一条只是“立刻顺手”的东西，等后头真碰到更值钱的目标时，难受的只会是自己。", "林夜把目光从候选上挪开，又去看了一遍那件白装束带。", "```text\n【轻皮束带】\n【装备等级】：2\n【装备品质】：白色·普通\n【装备部位】：腰部\n【属性】：敏捷+1\n【说明】：用薄皮和麻线缝出的简易束带，比新手布条更利落些。\n```", "装备可以先收，候选却不能乱按。林夜想了一会儿，最终抬手把那道灰白界面关掉，什么都没选。", "界面散开的时候，没有惩罚，也没有系统额外警告，仿佛只是安安静静地把选择权重新还给了他。林夜站在坡上，看着那点灰白光慢慢淡掉，心里反而更定了。", "空着第一格，并不亏。", "真正亏的是，为了眼下多舒服一点，把它先填错了。", "他把轻皮束带收进背包，抬头看向东边那片雾色更重的林线。那里依旧安安静静，没有任何特别起眼的动静。可林夜知道，值钱的东西从来就不长在这种随手能打到的草坡上。", "灰背迅兔只是让他把这份天赋的第一层规则看清了。", "接下来，该去找真正配得上第一格的东西了。"]}, {"id": "007", "title": "空着的第一位", "time": "2041年7月18日 02:03至02:46", "location": "青石村东侧草石坡、采药小屋外缘", "paragraphs": ["关掉那道候选界面以后，林夜并没有立刻离开草石坡。", "很多决定，真正麻烦的地方从来不在你按下去那一下，而在你按住没动之后，心里会不会反复回来拉扯。尤其是刚才那条 `D级·短促爆发`，并不是完全没用。对现在这个阶段的他来说，它甚至算得上相当顺手。赶路、抢位、临时脱战，随便哪一项都能立刻吃到好处。也正因为这样，它才最容易骗人。", "林夜站在坡上，盯着远处的林线看了一会儿，最后还是把天赋那栏重新拉了出来。", "刚进游戏时那几行说明他其实已经看过一遍，可那时候抽到 `SSS` 的冲击太猛，脑子里的注意力根本压不住。现在候选真落过一次，他再去看，很多东西的分量就完全不一样了。", "```text\n【当前复制位】：1/1（空置）", "【空位复制】\n满足条件后，可直接填入候选天赋。\n复制完成后即时生效。", "【占位替换】\n已占用复制位可主动替换。\n替换完成后，该复制位进入72小时冷却。\n冷却期间，当前天赋可正常使用，但不可再次替换。\n```", "七十二小时。", "这个数字在现在看，甚至比刚才那条候选本身更扎眼。", "开服前三天意味着什么，别人或许还没概念，林夜却太清楚了。那是整个新手阶段最值钱、也最不能浪费的时间。任务、精英、偏线、第一批过渡装备、第一轮隐藏触发、离村路线，很多东西都集中压在这段时间里。要是第一格为了图手头这点舒服先塞错了，后面就算碰见真正该拿的天赋，也只能看着位子被冷却死死卡住。", "到那时，亏掉的就不是一条候选，而是一整截发育线。", "想到这里，林夜反而一点也不着急了。他甚至有种很清楚的感觉，复制这种天赋最考人的地方，恐怕根本不是“能不能打出候选”，而是“明明手里有位子，你能不能忍住不乱填”。", "他把说明关掉，顺手又处理了两只沿坡游走的普通短尾狐和一只石背鼠。短尾狐死后，仍旧会留下那点极淡的速度倾向感；石背鼠则什么都没有，只掉出一张硬皮和一枚铜子。到这里，前面的判断也越来越实了。候选不是逮什么怪都能成形，特征越单纯、层级越往上的怪，越可能给出真正能落手的东西。", "而且很明显，东林这条线里，值钱的还远不止一只灰背迅兔。", "一路试到采药小屋附近时，林夜顺手把昨晚杂货铺妇人提过的那袋空瓶送了过去。小屋里住的是个独居的采药妇人，三十多岁，手脚很快，说话却不急。她收起那袋空瓶时，先看了看林夜裤脚边沾着的泥和草屑，随后才递给他一小瓶淡红色药水。", "“东边路滑，又是夜里，能不摔最好，真摔了也别硬撑。”她把瓶塞往桌边一磕，发出轻响，“这点东西算不上多，起码能让你那条腿先顶一顶。”", "【完成委托：送回空瓶】", "【获得经验14点】", "【获得铜币3枚】", "【获得微型生命药剂x1】", "这段小插曲没什么惊天动地的东西，却让林夜心里那口气更加沉了些。他越来越喜欢这种开局方式了。不是一上来就赌天命，而是先靠最普通的事把自己垫起来。越垫，越稳，等真正要出手的时候，反而更不容易乱。", "他离开小屋以后，没急着回大路，而是沿着更偏东那条兽径继续往里走。这里人已经很少了，偶尔能在泥地上看见其他玩家试探着走过又退回去的脚印，浅浅一层，很快就断掉。说明前面有人来过，却没敢再深入。", "没过多久，林夜就在一块半塌的断墙后看见了第一道真正让他停下脚步的痕迹。", "不是怪，是一截刻着鹰爪印的旧木桩。", "印子很浅，几乎和木纹融在一起，不认真看根本看不出来。林夜蹲下身，用手指在那道刻痕边缘轻轻蹭了一下，心里缓缓沉了一层。前世他后来听人提过，青石村东林这条线早年并不是什么无主偏路，而是旧猎团留下来的一道筛选路。能顺着这些不起眼的痕迹一步步往里摸的人，本来就不多。", "再往前十来步，他终于在一片较高的草影后看见了真正像样的目标。", "那是一头伏在石坡边缘的豹。肩线压得很低，尾巴贴着草面缓缓扫动，毛色在夜色里泛着一层不太自然的青灰，整个姿态安静得惊人。光是看它趴着的那股劲，林夜就知道，前面那些灰背迅兔、短尾狐，全都不够和它摆在同一个层面上比。", "他站在原地，先没有动，反而慢慢吐出一口气。", "到这里，第一格到底该不该继续空着，已经不需要再靠想了。", "因为真正配得上它的东西，终于出现在眼前了。"]}, {"id": "008", "title": "残墙兽径", "time": "2041年7月18日 02:46至03:31", "location": "青石村东林残墙后石坡", "paragraphs": ["残墙后的风比外面更冷一点。", "豹还伏在那儿，肩背随着呼吸极轻地起伏，要不是那条尾巴偶尔扫过草面，几乎会让人以为那只是石坡边一块颜色更深的影子。林夜站在墙后看了片刻，心口那种一路试候选试到现在的绷紧，反而一点点沉下去了。", "因为到了这一步，他终于不用再靠猜。", "系统信息也很快在眼前浮出来。", "```text\n【精英疾风豹】\n【等级】：4\n【生命】：260/260\n【技能】：扑袭、疾掠、甩尾\n【说明】：东林速度系精英，擅长连续变向与短距离爆发，极易压死起步不足的远程职业。\n```", "一级打四级精英，别说对普通新手，就是对现在的林夜来说也不算轻松。可他没有退的意思。前面那些普通怪、强化怪、候选说明、七十二小时冷却，全都是为了把这一步撑出来。既然已经走到这儿了，再后退就显得可笑。", "林夜先看了一遍地形。", "石坡边缘有一块半埋的凸石，左侧低草下压着一截老树根，右边是一条稍低的碎土带。真打起来，他能借的地方就这么几个，一旦站错，后面会被疾风豹越打越难受。前世经验在这种时候不是“答案”，更多像一种老习惯。林夜很自然地先把最危险的两条扑线在脑子里划掉，随后才慢慢抬起弓。", "第一箭出去时，豹几乎和箭同一时间动了。", "-24。", "箭扎进前肩，精英豹落地后根本没有像普通怪那样先乱一下，反倒借着那点偏移极快地调整身位，贴着草面就扑了过来。林夜没有往后缩，脚下顺着那块凸石往外斜切，险险让开扑线，第二箭也在转身时补了出去。", "-29。", "这一箭打中了后腰，终于把疾风豹的节奏拽歪了半拍。可也仅仅只是半拍而已。下一瞬，它就接了疾掠，整头豹几乎贴着石坡斜切过来，快得像一阵低伏的灰风。林夜眼神一沉，顺手把身位往树根边抢，整个人借轻皮束带那一点点多出来的灵便，硬生生从那条扑线外侧抽开。豹影擦着他的腿边掠过去时，第三箭也顺着预判点压进了它的侧腹。", "-33。", "这一箭一落，疾风豹血线已经掉过了三分之一。它终于低低咆哮了一声，尾巴在草上重重一扫，整个身形压得更低，像是被彻底激了起来。林夜知道，真正难的地方现在才开始。速度型精英最烦的不是前两轮，而是血线下到一半以后那股愈发凶狠的追咬。一旦让它连住两下，弓手就会很难再舒服地拉出完整节奏。", "果然，后面那两轮扑杀比前面狠得多。", "一次是扑袭接甩尾，一次是疾掠后半途变向，两下都不是普通玩家刚进游戏能应付的东西。林夜也不是每一下都能处理得滴水不漏，左小腿还是被尾风刮了一下，血量当场掉了一截，火辣辣的疼顺着胫骨往上窜。", "可他没有乱。", "药先喝半口，位置先拨出去，呼吸也先压住。林夜前世最会处理的，就是这种“局势已经开始难受，但还没彻底崩”的中段战。真正会死的人，往往不是顶不住第一轮，而是在第二轮手脚一乱，整个人都被怪带着跑。", "他不想重来以后第一场真精英战就犯这种蠢。", "接下来的几次交换里，林夜开始把自己往那截老树根附近逼。那地方不大，正常来说会让远程觉得施展不开，可对疾风豹这种特别能借直线扑杀的东西来说，反倒正好能压它半步。等它第三次顺着草线扑来时，林夜索性没有先退，反而迎着它斜切半步，短匕一挑，逼它脖颈偏开，随后一箭几乎贴着脸压了出去。", "-41（弱点）", "这一下终于把疾风豹打得往后一趔趄。", "林夜等的就是这一拍。前面所有忍、所有让、所有不贪伤害，都是在等这种能把它彻底打乱的时候。接下来两箭一前一后跟上去，第一箭打胸，第二箭扎进后腿根部，把这头精英生生压到只剩最后一截血。", "疾风豹低吼着还想再扑，林夜却没有再退。他脚底踩稳那截树根，最后一箭平平送出，正中颈侧。", "-38。", "豹尸重重摔在草坡边，抽了两下，很快没了动静。", "林夜站在原地缓了几口气，后背已经起了一层汗，连指尖都因为绷得太久有些轻微发麻。他知道自己刚才赢得有多险。不是路线不对，也不是判断不够，而是现在这身板子和这把新手短弓，打这种级别的精英，本来就已经在吃老本了。", "系统奖励随之亮起。", "【击杀精英疾风豹，获得经验92点】", "【越3级击杀修正：+60%】", "【获得：豹牙x1】", "【获得：精豹韧皮x1】", "【获得：铜币6枚】", "【获得：豹皮护腕x1】", "经验条往上蹿了一大截，却还差一点没升。林夜刚弯腰去收豹皮护腕，那道只有他才看得见的灰白界面便稳稳浮了出来。", "```text\n【可复制候选】\n【目标】：精英疾风豹", "【候选一】：C级·加速\n【效果】：激活后5秒内，移动速度提升35%。", "【候选二】：A级·轻身\n【效果】：减轻身体负担，提升复杂地形中的平衡、落点修正、急停转向与落地稳定性。\n```", "林夜看着这两条候选，心口很轻地跳了一下。", "终于来了。", "而且来的不是单一答案，是两条都能让人心动的路。C级加速简单、直接、立刻能用，谁看都知道它前期好使。A级轻身则没那么直观，甚至乍一看会让人觉得不够痛快，可如果真把前面断崖、石坡、残墙这些地形放进来，它的价值又明显比加速更深。", "林夜没有马上去点，而是先把复制说明又拉出来看了一遍。", "空位复制，立即生效。", "占位替换，七十二小时冷却。", "就是这条冷却，像一根钉子，把他原本可能一时冲动按去加速的手，硬生生钉在了原地。因为他忽然很清楚，自己现在不是在选“哪条更爽”，而是在选“第一格接下来三天到底站在哪条路上”。", "如果接下来只想把村口草坡和普通刷怪区刷得更舒服，加速当然没问题。可他今晚真正想要的，根本不是这点舒服。他想去的地方，在更东边，在断崖后，在那些普通人明知道有路也走不过去的地方。真要到那种地方，比快更值钱的，从来都是脚下那一点稳。", "想到这里，林夜再没有犹豫，把手按在了第二条上。", "【是否复制：A级·轻身】", "【当前复制位为空】", "【复制后即时生效】", "【提示：若未来主动替换该复制位，替换完成后将进入72小时冷却】", "“确认。”", "银青色的光在界面中央一散，顺着指尖没进身体。那感觉和他想象中的“暴涨”完全不同，不像力量往上冲，也不像整个人忽然变快，更像肩背、腰腹、膝踝这些最吃力的地方，被谁轻轻揭走了一层原本看不见的重。林夜甚至下意识往旁边挪了一步，落脚时立刻就察觉到了差别。重心更容易稳，脚底也更容易找准那个不会滑的位置。", "第一格，终于真正落下去了。", "可就在这时，林夜鼻端忽然闻到一丝很淡的焦糊味。他低头看去，发现精英豹尸体散开的地方，草尖上沾着几粒极细的灰黑色屑子，像被什么极薄的火舔过。", "那东西一闪而过，却还是让他眼神微微沉了一下。", "他前世后期在某些地方见过相似的痕迹。新手村这时候出现它，太早了。可林夜没有在这里深想，因为他眼下有更现实的事要做。", "轻身已经到手。", "而它值不值第一格，很快就能在下一段路上直接见分晓。"]}, {"id": "009", "title": "豹影试锋", "time": "2041年7月18日 03:31至04:06", "location": "青石村东林石坡、断崖前路", "paragraphs": ["精英豹尸体散干净以后，林夜没有第一时间去看掉出来的护腕。", "他先往旁边挪了一步。", "这一步很小，甚至称不上动作，只是身体顺势往侧边换了个位置。可脚落下去的一瞬，他还是立刻察觉到了不同。不是那种夸张得让人一眼就能说出“变快了”的区别，更像是身体里某些原本细微却顽固的拖拽，突然被人轻轻揭掉了一层。脚底贴住碎石时，重心更容易找准；转身时腰腹和小腿接得更顺；哪怕只是踩过一截半埋在泥里的树根，落下去的那下也更稳。", "林夜又往前走了两步，随后才慢慢吐出一口气。", "这东西值了。", "不是因为它听上去多夸张，而是因为它正好卡在他现在最需要的位置上。前期开荒，很多收益并不来自面板上直截了当多出来的攻击或速度，而是来自“别人不敢走的路你能走”“别人容易滑的地方你不滑”“别人必须停下来稳一稳的时候你还能多撑一步”。这种差距放在一场战斗里也许不明显，可一旦落进长路线里，往往会越滚越大。", "想到这里，林夜才弯腰把豹皮护腕和其他掉落收起来。", "护腕是件绿色精良，属性不算炸，却足够顺手。", "```text\n【豹皮护腕】\n【装备等级】：3\n【装备品质】：绿色·精良\n【装备部位】：护腕\n【属性】：敏捷+2\n【属性】：攻击速度+3%\n【说明】：用精英疾风豹前肢韧皮制成，贴手，回弓很顺。\n```", "等级还差两级，现在穿上会打折，意义不算大。林夜把它收进背包，没有急着换。真正值钱的还是眼下这份轻身带来的可能性。既然第一格已经按下去了，那就没理由继续在草石坡附近磨时间。", "他顺着残墙往东走，很快就摸到了一条比前面更偏的兽径。路不宽，草压得却很乱，显然常有东西从这里来回踩。林夜前世听过这条线，却从没在开服第一夜自己亲手走过。那时候的他知道东边有东西，也猜到和旧猎团有关，最后还是差在“去不了”。现在不同了。真正把脚迈进去的时候，林夜心里甚至生出一种很奇怪的平静，像自己终于补上了前世很久以前就该补的一步。", "越往里，路越难走。", "地面不再是村口那种平缓草坡，而是夹着湿泥、碎石和断根的林中窄路。有两处下坡尤其滑，普通人踩上去，身体本能就会先绷紧。林夜走到那里时，也照样先放慢了一拍，可轻身的效果很快就把那种“要不要先停一下再走”的犹豫压了下去。重心落得更准，脚踝也更容易在踩空前把位置拧回来。那种感觉并不热闹，却让人很踏实。", "中途他又碰见两只拦路的风尾狸和一只从断根后冲出来的裂齿蝠。换作刚进游戏那会儿，这三只怪也够他费些手脚。现在再打，却明显顺多了。不是伤害突然高了多少，而是每一次让位都更利落，每一箭出手前的那一点空隙也更稳。", "连着三场小战以后，经验条终于再次撞过门槛。", "【经验已满，等级提升】", "【当前等级：2】", "暖流从四肢漫开时，林夜正站在一处略高的石坡边。他顺手拉开面板看了一眼。", "```text\n【姓名】：林夜\n【等级】：2\n【当前经验】：21/180\n【职业】：弓箭手\n【生命】：121/121\n【法力】：50/50\n【力量】：7\n【敏捷】：10\n【体质】：8\n【精神】：4\n【感知】：9\n【天赋】：SSS级·复制\n【已复制天赋一】：A级·轻身\n【技能】：无\n【装备】：新手短弓、新手布衣、粗布护腕、轻皮束带、练习箭矢x19\n【货币】：17铜 0银 0金\n```", "等级一抬，底气又多一层。可林夜没有因此自满，反而把面板很快关掉，继续往前走。因为他已经能看见更清楚的痕迹了。", "一截半埋在泥里的旧木桩，边缘刻着极浅的猎鹰印；一块被人特意垫平的小石面，位置刚好卡在下坡转弯处；甚至连一段爬过断藤的手位，都留得异常顺手。这些东西单独拎出来都不起眼，连在一起却很说明问题。这里以前确实有人常走，而且不是普通村民，更像一批专门跑林路、打野线的人。", "旧猎团这三个字，到这里终于不再只是影子了。", "再往前，路忽然断开。", "不是彻底没了，而是被一道斜着劈开的岩缝截成了两半。缝外就是断崖，风从下头卷上来，带着一点潮冷，能听见碎石偶尔滚落的轻响。林夜站在边上，先没有贸然往外踏，而是把四周仔仔细细看了一遍。", "前世传闻里的藏点，应该就在这后头。", "而现在，门已经到眼前了。"]}, {"id": "010", "title": "断崖藏匣", "time": "2041年7月18日 04:06至04:49", "location": "东林断崖、崖后石龛", "paragraphs": ["真正站到断崖边上的时候，林夜还是先沉默了一会儿。", "前世他听人说过这里难走，也知道这是青石村开服前期最值钱的偏点之一，可“听说”和“自己站到边上看”到底是两回事。崖不算高得吓人，真正要命的是那条贴着岩壁横出去的窄脊。外侧是碎石坡，内侧是长满湿苔的岩面，中间那点能落脚的地方窄得厉害，最薄处恐怕连完整一掌宽都没有。更麻烦的是夜里风湿，石面始终带着一点滑。普通人不是过不去，是不敢拿开服第一夜的节奏去赌这么一下。", "林夜同样没打算赌。", "他沿着崖边慢慢走了小半圈，把能借手的石棱、能落脚的硬面和几处已经被雨水泡软的苔皮全看了一遍，才重新退回起点。很多人总觉得高手走偏线靠的是胆子大，其实恰恰相反。越是险路，越不能靠胆子硬顶。你得先看懂，再决定值不值得把脚迈出去。", "前两步最关键。", "林夜把弓往背后扣稳，手掌贴住内侧岩壁，肩背一点点绷起来。第一步落下去时，鞋底先在湿苔上轻轻滑了半寸，随后才稳住。要是没有轻身，这半寸就足够让他本能地先把身体往回缩。可现在不一样，他能明显感觉到重心比原先更容易被自己抓住，脚底那点微小偏差也更快被腰腹和膝踝吃掉。", "第二步、第三步，一点点挪出去以后，林夜心里反倒更静了。", "这条路值钱，不只是因为它通向藏点，也因为它本身就是筛人用的。你有没有那份胆子、细心和脚下功夫，走两步就能看出来。等挪到中段时，前方刚好裂开一道更宽的豁口。下面黑沉沉的，风从崖下涌上来，像是要把人往外拽。", "林夜先抬头看了看上方那截突出来的石棱，又低头看了一眼脚下最后能借力的那块硬面，心里飞快算了一下自己起步、抬手和翻身的顺序。下一瞬，右脚蹬出，人整个往上轻轻一提，手掌刚好扣住那截石棱边缘，借着轻身带来的那点稳定，身体顺势翻了过去。", "落地时鞋底在湿石上擦出一声极轻的响。", "没滑。", "林夜站稳以后，自己都缓了半口气。他前世没亲手走过这一段，心里终究还是有些悬。现在真正翻过来，那点悬着的劲也终于落了地。不是因为轻身把难度全抹掉了，而是因为它刚好把“够不着”变成了“咬牙能吃”。", "崖后是一道很窄的石缝，口子被灌木和斜生的长草遮住，不蹲下来看根本发现不了。林夜把草拨开，俯身钻进去，里头果然是一处不大的石龛。墙面干裂，角落里还残着发黑的旧泥痕和一点散掉的灰，像很多年前真有人在这里生过火、歇过脚。", "石龛最里面压着一口旧木匣。", "木匣边角磨损得厉害，锁扣附近却还能勉强看出一道已经很浅的猎鹰纹。林夜看到那纹路的一瞬，心里反而更笃定了。村长嘴里的东林旧路、残墙边的鹰爪记号、断崖这条窄脊，再加上眼前这口匣子，全都不是散着摆出来的巧合。这是一条被人专门留下来的旧线，只是留到后来，知道怎么走的人已经没几个了。", "木匣掀开时，系统提示和一股很淡的木灰气味同时扑出来。", "【发现旧猎团藏匣】", "【获得探索经验48点】", "【获得：猎风长弓x1】", "【获得：鹿皮轻靴x1】", "【获得：微型生命药剂x2】", "【获得：银币18枚】", "【获得：旧猎团残牌x1】", "林夜先看的是钱。", "十八银。", "一百铜换一银，开服第一夜的新手村，很多人兜里连一银都未必攒得出来。可现在这一匣子一开，十八银直接落袋。那种感觉甚至不是“发财了”，而是你忽然不用再为后面最基础的补给、修理和过渡装备抠抠索索。对独狼弓手来说，这种底气太重要了。你手里有钱，很多路就能走得更硬一点；你手里没钱，哪怕知道前面有东西，也常常会被两瓶药、一次修弓活活劝退。", "接着才是那把弓。", "```text\n【猎风长弓】\n【装备等级】：3\n【装备品质】：蓝色·稀有\n【装备部位】：主武器\n【属性】：攻击+10\n【属性】：敏捷+2\n【属性】：暴击率+2%\n【特性】：攻击移动中的目标时，额外造成3%伤害。\n【说明】：旧猎团制式长弓之一，弓身轻，回弹快，适合耐心够好的人。\n```", "还有那双靴子。", "```text\n【鹿皮轻靴】\n【装备等级】：3\n【装备品质】：绿色·精良\n【装备部位】：足部\n【属性】：敏捷+2\n【属性】：移动速度+4%\n【说明】：柔韧、轻便，抓地很好，最适合在碎石、林地和断坡之间来回跑动。\n```", "两件装备都没超纲得离谱，反而卡得很讲究。品质高，等级却只比他现在高一步。也就是说，这不是“拿到就乱杀”的白送，而是一种极其勾人的前置优势。只要他再往前提一级，这批东西立刻就会彻底转起来。", "林夜先把长弓拿起来试了试。和新手短弓完全不同，这东西的弓身更韧，回弹也更干净，拉开时那股绷劲一传回来，人立刻就知道，什么叫“真正能打东西的弓”。他试完以后，甚至连肩背都轻了几分。", "面板也跟着变了一点。", "```text\n【姓名】：林夜\n【等级】：2\n【当前经验】：161/180\n【职业】：弓箭手\n【生命】：121/121\n【法力】：50/50\n【力量】：7\n【敏捷】：12\n【体质】：8\n【精神】：4\n【感知】：9\n【天赋】：SSS级·复制\n【已复制天赋一】：A级·轻身\n【技能】：无\n【装备】：猎风长弓、新手布衣、粗布护腕、轻皮束带、鹿皮轻靴、练习箭矢x19\n【货币】：23铜 18银 0金\n```", "还不算成型，可已经足够让人看见轮廓了。", "林夜看着面板，心里那根从回到开服前夜起就始终绷着的线，终于稍稍松了一点。不是因为到这里就万事大吉了，而是因为他终于拿到了今晚第一份真正能叫“起势”的东西。前面那几枚铜币、那几件白装、那只精英豹，全都很重要，可真正把优势一下撑开的，还是这口藏匣。", "木匣最底下还压着一块残缺木牌，边角裂得厉害，正中那道猎鹰印却比外面的刻痕更完整。翻到背面，能看见断断续续几个磨浅的字。", "“……井……火……回猎……”", "字不全，意思却够用了。", "东林这条线，后面显然还连着别的东西。林夜把残牌收进背包，正准备转身出龛，忽然听见石缝外头有很轻的一声响，像有人踩断了一截枯枝，又立刻把力道收住了。", "林夜动作顿了一下，手已经下意识落回弓上。", "等他从石缝里慢慢钻出来，隔着残墙和雾气，正好看见一道站在那儿的身影。不是玩家，也不像普通村民。那人年纪不小，肩背却没塌，脚边搁着一张旧弓，正安安静静地朝崖这边看过来。", "东林这条路，到这里才算真正接上了活人。"]}, {"id": "011", "title": "残墙后的人", "time": "2041年7月18日 04:49至05:26", "location": "东林残墙、回南坡小路", "paragraphs": ["那道人影站在残墙后，安静得近乎没有存在感。", "要不是林夜刚从石缝里出来，视角正好抬高了一点，未必会第一时间发现那里居然站着个人。对方穿着深灰色的旧短褂，裤腿扎得很紧，鞋面沾着潮泥，脚边那张弓更是用得很老，包手的位置都被磨出了浅亮的色泽。最让人在意的不是这些，而是那股气。不是村里老人那种慢吞吞的闲散，也不是普通猎户那种小心翼翼的谨慎，而是一种长年站在林子里、早把呼吸和四周风声压成一处的沉。", "林夜从他身上挪不开眼，对方也同样在看他。", "两人隔着断墙和雾气对视了片刻，还是那老人先开的口。", "“崖后那口匣子，是你开的？”", "声音不高，带一点被风吹旧了的哑，却稳得很。", "林夜没有装傻，只点了点头：“是。”", "老人视线从他脸上慢慢往下落，停在那张新换上的猎风长弓和靴子上，随后又扫过他裤脚边还没蹭净的湿泥。那一眼很短，却像把他刚才怎么过崖、怎么进龛、又怎么出来，全都顺手掂了一遍。", "“脚底不乱，弓拿得也不算虚。”老人这才把弓从地上提起来，语气里听不出太多喜怒，“说明你不是撞运气进去的。”", "林夜听懂了他的意思。", "这老家伙不是在夸他，只是在确认一件事，确认林夜到底是摸对了路，还是单纯瞎猫撞上死耗子。要是后者，后面的话多半也就没必要说了。", "“前辈认得那地方？”林夜问。", "老人嗯了一声，低头抹掉弓背上的一层潮气，动作慢，却没有停顿：“认得。以前替人守过，也替人埋过。后来知道这条路的人越来越少，敢走的更少，那口匣子也就一直搁着了。”", "他说得很平，像在讲一段已经干掉很多年的旧事。可林夜听到“替人埋过”那半句时，还是不由得多看了他一眼。东林这条线果然不是普通偏门路子，而是真真切切地出过事，也死过人。", "老人像没察觉他的目光，视线又落到了林夜背包边缘露出来的一角木牌上。那是刚从石龛里拿出来的旧猎团残牌，裂得很厉害，正中那道猎鹰印却还在。", "“既然摸到这块牌子，就说明你不是为了几枚铜子才乱跑。”他说到这里，终于抬起手，往南边坡下一指，“那边有口枯井，井口那圈石头发黑得不正常。你去看看。别站正中间往下探，井里那点东西不讲道理，专挑人脸扑。”", "这话说得很像提醒，又不像真正把任务往人脸上拍。既没有解释那口井为什么值钱，也没有把里面到底藏着什么说得明明白白。可也正因为这样，林夜心里反而更稳。真正值钱的暗线，从来不会一上来就把前因后果和奖励都端给你。多半都是先丢一句话、一个地方、一点痕迹，看你会不会自己往下接。", "“看完回来？”林夜顺着对方的话问了一句。", "老人抬眼瞥了他一下，像终于从这句问话里听出些意思，嘴角很淡地动了动，也不知算不算笑。", "“你要真能把东西带回来，再回来找我也不迟。”", "说完，他顿了顿，又像想起什么似的补了一句：“我姓韩。剩下的，等你先把井下那点东西翻出来再说。”", "韩沉。", "林夜把这个名字在心里过了一遍，没有继续追问。因为他知道，问下去也没用。对方既然愿意在这里等他从断崖后出来，说明人本来就有接线的意思；可要是没见到林夜把枯井那段也吃下来，这老家伙显然不会再往深里多吐半个字。", "系统提示也在这时轻轻亮了一下。", "【你从残墙后的人口中，得知了“枯井火痕”的线索】", "【隐藏线索已记录】", "很轻的一句，没有正式任务，也没有奖励框。可林夜看到这里，心里反而更踏实。东林这条线到这一步，终于从“前世听过的值钱偏点”变成了一条眼下真正活着的路。", "临走前，韩沉目光忽然在林夜右手上停了停，像是察觉到了什么不太一样的地方。可他最终什么都没问，只抬手把那张旧弓重新搭回肩上，淡淡说了一句：“你这会儿脚底正热，最容易高估自己。下井的时候，把那股热劲先压一压。”", "林夜应了一声，转身往南坡去。走出十来步后，他还是忍不住回头看了一眼。韩沉已经不在原地了，残墙后只剩下半段被雾气浸着的旧木桩，像刚才那个人从头到尾都只是林子里露出来的一道影。", "风从南边吹过来，带着一点潮冷，坡下那口枯井还藏在树影里，暂时看不清轮廓。可林夜知道，真正的路已经被递到他手上了。接下来能不能再往前走，就得看他有没有本事把井底那截火痕翻出来。"]}, {"id": "012", "title": "枯井余烬", "time": "2041年7月18日 05:26至06:09", "location": "青石村南坡枯井", "paragraphs": ["南坡那口枯井比林夜想的还更偏。", "要不是韩沉特意点过一句，普通人从旁边走过，多半只会把它当成一口早废掉的旧井。井口被半人高的野草和歪长出来的灌木围着，石圈也塌了一半，远看灰扑扑的，根本不起眼。可等林夜真走近，目光落到井圈边缘时，还是很快看出了不对。", "那一圈石头发黑得太均匀了。", "不是泥，不是潮，也不是日久天长蹭出来的脏色，而像确实被什么火从内往外燎过。问题是井边四周的杂草、碎木和泥地，却都没有大面积烧灼的痕迹，好像那股火只冲着井口这一圈来，烧完又自己收回去了一样。", "林夜蹲下身，用指腹在石圈边缘轻轻抹了一下。灰很细，沾手的那一下甚至有点发硬，和普通木灰的松散感完全不同。他盯着那点灰看了片刻，心里已经先沉了半寸。", "这东西，不像正常火烧出来的。", "他没直接探头去看井底，而是沿着边缘先绕了一圈。井不深，真要说高也就两层楼不到，可最要命的是井壁里侧全是突出来的旧砖和碎石，一旦有什么东西顺着这些凸点往上窜，人若站正中央往里探，几乎是把脸主动送过去。韩沉那句“别站正中间”说得半点没错。", "林夜最后在井口偏南的位置停下，先捡了块小石子丢进去试声。", "石子碰井壁、落到底部碎木里的声音刚响完，下面就紧跟着传来一道很轻却很尖的抓挠，像有什么东西被惊醒了，正在旧木和砖缝里飞快折腾。林夜眼神一沉，立刻往后撤了半步。下一瞬，一团灰黑色的影子已经贴着井壁窜了上来。", "```text\n【裂齿蝠】\n【等级】：3\n【生命】：88/88\n【技能】：扑咬、噪鸣\n【说明】：常年缩在潮湿暗处的小型怪，会借狭地突然扑脸。\n```", "井口这种地方，弓手最怕的就是这种贴脸怪。距离太近，空间太窄，稍一乱就会被它整个糊到脸上。可林夜这一路从村口打到现在，最值钱的地方本来就不只是路线和装备，还有那股重新接回来的手感。他几乎没怎么思考，弓已经抬起，箭线在近距离一压到底。", "-34。", "裂齿蝠被这一箭打得猛地一偏，半边翅骨都折了，刚摔到井沿，第二箭便顺势补了上去。", "-31。", "蝠尸翻落在石圈旁边，抽了两下，很快没了动静。", "井底却没有因为这一下安静下来。抓挠声反而更多了些，还夹着更沉的摩擦，像有体型更大的东西在腐木和碎砖之间拱动。林夜没有站在原地等，而是再往后让了两步，把井口两个最容易蹿出东西的位置一并纳进视野里。", "很快，第二只怪也上来了。", "不是蝙蝠，而是一只背毛发脏、前爪特别粗的井鼠。那东西顺着井壁往上攀时一点都不笨重，反而带着股窄地方里特有的狠劲，像在这种地方缩得久了，连扑人都更直接。", "```text\n【井口腐鼠】\n【等级】：3\n【生命】：112/112\n【技能】：抓咬、土扑\n【说明】：长期盘踞在废井和腐木堆里的杂食怪，正面冲力很足。\n```", "它刚爬上半身，林夜的箭便先一步顶在胸前。", "-27。", "腐鼠扑上井沿时，动作已经慢了半拍，林夜顺着这半拍再补一箭，把它血线一下拉到危险边缘。等它真红着眼往前扑时，林夜才借轻身往侧边抽身，让过它最笨重的正面冲线，短匕顺手一送，战斗很快结束。", "后面又陆续爬上来两只同类，一只裂齿蝠。井口空间小，打起来确实不算舒服，可林夜反而越打越顺。因为这种怪的威胁点都非常明确，突脸、逼乱、借狭地不让你展开，只要先把自己站稳，它们其实没有太多新鲜花样。弓手在这种地方最怕的是心先乱，一乱，手上的弓就真变成了累赘。", "等最后一只腐鼠从井沿摔下来时，系统提示终于一起亮了。", "【清除了枯井上层盘踞怪物】", "【获得探索经验32点】", "【获得：铜币5枚】", "【获得：旧箭头x1】", "那截旧箭头是从井底腐木堆里翻出来的，箭身早就烂没了，只剩下前端一小截铁色发暗的箭镞。林夜把东西捡起来时，指尖先感到一丝很不自然的凉意。等他把箭头翻到光下仔细一看，整个人也跟着沉了下去。", "箭镞边缘，粘着一层极薄的灰黑色细屑。", "和先前那头精英疾风豹尸体边上的东西几乎一模一样。", "这一下，前面那些原本还能勉强被他归进“也许只是巧合”的念头，终于开始真正发沉。因为井口这种地方，不会无缘无故留下一枚带着相同灰痕的旧箭头。说明很久以前，至少有人在这里也碰过相似的东西，甚至用箭去挡过。", "林夜站在井边，没急着立刻回去，而是先把那枚箭头在掌心里翻了两遍。井下还没完全清干净，真正值钱的路大概也不只这一层。可对现在的他来说，这截旧箭头已经足够把下一步方向指得更清楚了。", "韩沉让他来看井，看的恐怕根本不只是井底那几只怪，而是这层不该在青石村这么早露出来的灰。", "想到这里，林夜把箭头收进背包，抬头朝残墙方向望了一眼。", "天边已经开始泛白了。", "而这条线，到这里才像刚刚热起来。"]}, {"id": "013", "title": "井下残箭", "time": "2041年7月18日 05:32至06:18", "location": "东林残墙、枯井下层", "paragraphs": ["韩沉还站在残墙那边，像一整晚都没挪过位置。", "林夜把旧箭头递过去，对方没有立刻接，而是先垂眼看了一下箭镞边缘那层薄薄的黑灰，随后才伸手捏起。老人指腹在铁面上蹭了一下，神情没什么变化，可眉眼间那点原本就压得很低的冷意，还是更沉了一分。", "“看出来了？”他问。", "“不是普通火灰。”林夜答得也直，“精英豹身上也有。”", "韩沉嗯了一声，过了片刻才慢慢开口：“井口以前不是拿来打水的，是拿来守路的。底下那条缝通着一段旧沟，沟口不大，适合埋陷阱，也适合拦东西。后来守的人死光了，井也就荒了。再后来，里头又开始有东西动。”", "他说到这里，终于把那枚箭头递还给林夜。", "“这支箭原先不该掉在上头。”韩沉看着他，语气依旧不急，“你既然翻出来了，说明下层也该给你看看。往下走的时候，别总想着拿弓把所有地方都打成你自己的。井底窄，弓手在那种地方要是只会退，退着退着就退没了。”", "话不多，意思却已经够清楚。", "韩沉这是在点他。", "前面井口那一段只能算开门，真正的东西还在下层。至于怎么进、怎么打、怎么把弓手在狭地里的短板拧过来，就全得林夜自己去做。", "系统提示也在这时落了下来。", "【隐藏任务更新：枯井守痕】", "【第一环已完成】", "【当前目标：进入枯井下层，寻回“守井人的残火”】", "【阶段奖励：经验40点，铜币6枚】", "奖励不算夸张，分量却正好。林夜吃下这截经验以后，距离四级也就只差一步。他没多耽误，回井边先把身上的状态补了一遍，又在周围找了根还算结实的旧麻绳，顺着井壁慢慢下去。", "井下比上面更闷。", "碎砖、烂木、积水和陈了太久的潮气混在一起，味道发酸。底部靠东侧的位置，果然裂开一道只够一人侧身过去的窄缝。韩沉说的那条旧沟，多半就在里面。", "林夜没有直接钻，先摸了摸石面。", "缝口边缘留着几道抓痕，浅却很密，明显是有什么东西经常从这里来回蹭。那类怪一旦在窄缝里冲出来，弓手最容易被贴得措手不及。林夜索性先把短匕握稳，侧身挤了进去。", "沟道比想象中更狭，顶上低，脚下还滑。往前不过十几步，右侧腐泥里就突然窜出一道灰影，直冲林夜腿弯。", "```text\n【灰井獾】\n【等级】：4\n【生命】：150/150\n【技能】：顶冲、撕咬\n【说明】：长期栖在废沟里的蛮横怪，正面冲力很足。\n```", "林夜根本来不及完整拉弓，干脆一脚蹬在侧壁上，整个人往左抬开一点，险险让过第一下冲线。灰井獾撞在沟壁上，泥水和碎石一起崩开，林夜趁它回头前半转身，一记直射近距离顶了出去。", "-51。", "这种距离下的直射，和野外开阔地里用起来又是另一回事。它不是为了拉满视野下的准头，而是把弓手在狭地里最难抬出来的那一下爆发，硬生生提早了一口气。灰井獾吃下这一箭，动作顿时重了不少。林夜没后退，短匕先逼，再借着沟壁转身补箭，连着三下把它压死在自己最擅长的那条冲线上。", "后面还有两只同类，一只裂齿蝠。越往里，沟道越拐，很多地方只能半扭着身子打。林夜一开始还会觉得别扭，打到后头却渐渐适应了。因为他发现，韩沉那句“别总想着退”说得半点不虚。在这种地方，远程职业真要一味后撤，只会把自己逼进更窄的位置。反倒是提前抢出半步，把怪卡在它最难受的角度上，才能把局面重新掰回来。", "等最后一只裂齿蝠从头顶摔下来时，系统提示终于一起亮了。", "【完成隐藏任务：枯井守痕·第二环】", "【获得经验40点】", "【获得铜币6枚】", "【获得：守井火种x1】", "【等级提升，当前等级：4】", "火种并不是真的火，而是一小截被黑灰包住的焦木芯，掰开以后，中间还埋着一点暗红色的余烬纹。林夜把它捏在手里，莫名想起黑裂谷底那层总也散不干净的暗雾。两者当然不是同一种东西，可那股说不出的异样感却很像。", "等他从井底重新爬上来时，天边已经慢慢发白。", "韩沉还是站在原处，看见他手里的火种，只淡淡说了一句：“行，井没白下。”", "说完以后，他目光越过南坡，落向更深的林地。", "“井底那点东西，只够你热个身。”老人把旧弓往肩上一挪，声音也比之前更低了些，“再往里，有头长着黑斑的角鹿。这些天常往旧药圃那边拱地，拱出来的泥都是黑的。你要是还想往下摸，就去把它解决掉。”", "林夜听见“黑斑”两个字时，眼神微微一沉。", "真正的东西，显然从这一头才开始。"]}, {"id": "014", "title": "药圃黑角", "time": "2041年7月18日 06:18至07:06", "location": "东林旧药圃", "paragraphs": ["旧药圃在东林更深一点的凹地里。", "地方不大，四周原本应该立着木栏，如今只剩半截朽桩。地里到处是翻开的泥痕，像被什么东西反复犁过，翻起来的土颜色也不正，潮湿发黑，混着一股很淡的焦腥气。林夜刚踩进去，鞋底就明显沉了半分。", "这种地方对弓手并不友好。", "泥软，容易陷脚，四周还零零散散生着高过腰的荒草，一旦被怪借着掩住身形，视线和提前量都会受影响。林夜绕着药圃外沿转了半圈，先把几处勉强能借力的石块和树根看清，这才真正把目光落到凹地中央。", "那头鹿正低着头，在一片黑泥里拱什么东西。", "它体型不小，肩线很高，角也比普通林鹿粗上一圈。最让人不舒服的是背上那几片不规则的黑斑，像是从皮底透出来的焦色，顺着脊线一路爬到后腰，看久了甚至会让人觉得那层毛下面有什么东西还在慢慢流动。", "```text\n【黑斑角鹿】\n【等级】：5\n【生命】：340/340\n【技能】：角撞、踏震、狂奔\n【说明】：受未知异样侵染的东林精英，冲撞欲望很强，对地形破坏明显。\n```", "林夜看到“未知异样侵染”这几个字时，心里先是一沉，随后反而更冷静了些。系统在新手村这个阶段，很少给怪标这种模糊却扎眼的描述。既然给了，就说明这只鹿身上的问题已经不是纯靠面板能解释的。", "他没有抢第一箭，而是先往左前方挪出一条斜线，给自己留好退和转的空间。黑斑角鹿耳朵忽然一抖，猛地抬头，鹿角上沾着的黑泥往下滴。下一瞬，它连试探都没有，直接压低脑袋冲了过来。", "林夜等的就是这一下。", "直射先手。", "-43。", "箭矢直扎进前胸，黑斑角鹿却只是身形微微一滞，随即硬顶着那股疼继续往前冲。普通精英挨了这一箭，大多会先乱一拍，这只却像根本不肯退，反而更凶。林夜侧身让开正面，脚下踩上一块裸石，把轻身带来的落点修正吃满，第二箭顺着鹿身擦过去时拉出一道更深的伤口。", "-36。", "黑斑角鹿一头撞空，四蹄重重踏下。药圃地面跟着震了一下，黑泥往外炸开，林夜虽然提前退了半步，小腿还是被溅上一片泥点。那泥冷得发黏，碰上皮肤的感觉很不舒服。", "他皱了下眉，立刻再退，不给对方第二次连撞的机会。", "接下来几轮交手，林夜慢慢摸出来了。", "这东西最难受的不是伤害，而是它会不断把药圃这块本就不好走的地面越踩越烂。你越拖，自己的脚底就越差，反倒它这种四蹄着地的怪受影响没那么大。换句话说，这场战斗不能贪稳拖长，得在还能跑出节奏的时候把它压死。", "想清这一点，林夜的打法立刻就变了。", "他不再一味往外拉，而是开始主动借那几处硬地小圈做折返。黑斑角鹿每次冲线，他都用轻身抢先半步，把自己稳稳落在更硬的石根边上，再用直射和普通箭交替去打它撞空后的短停顿。如此反复三轮后，黑斑角鹿血线终于跌过了一半，呼吸也明显粗重起来。", "可异样就是在这时冒出来的。", "它后背那几片黑斑忽然一紧，像是活物似地收缩了一下，紧跟着整头鹿的速度猛地提了一截。那不是正常的狂奔节奏，更像硬把某种本不属于它的力量塞进了四肢里。林夜心里一凛，连忙往侧后方借步，险险擦着鹿角让过去，后腰还是被带起的角风刮得发冷。", "这东西已经不只是“怪”了。", "林夜咬住牙，药剂都没舍得在这时候乱喝。他知道眼前最重要的是先把节奏拉回来，药水晚一秒都行，脚步一乱就真没得打了。等黑斑角鹿第二次带着那股怪异劲冲过来时，他干脆迎着它侧前方切进去，短匕先刺眼下软处，逼得鹿头偏开，再借一块斜埋的石桩跃起半步，把直射几乎贴着鹿角压了出去。", "-57（弱点）", "这一箭终于把它打得趔趄。", "林夜抓住那一下摇晃，跟上两记普通箭，把剩下那点距离彻底吃干净。等黑斑角鹿最后一头撞进药圃边缘的烂木桩里，林夜才长长吐出一口气，握弓的手背全是绷出来的青筋。", "系统提示随后一股脑地落下来。", "【击杀黑斑角鹿，获得经验138点】", "【越1级击杀修正：+15%】", "【获得：黑斑鹿皮x1】", "【获得：污灰角芯x1】", "【获得：铜币12枚】", "【获得：鹿纹轻甲x1】", "经验条被这一战顶得猛往前窜，虽没立刻升级，却已经逼近五级。林夜先把那件轻甲看了一眼。", "```text\n【鹿纹轻甲】\n【装备等级】：4\n【装备品质】：绿色·精良\n【装备部位】：上衣\n【属性】：体质+2\n【属性】：感知+1\n【说明】：由韧鹿皮和旧纹布缝成的轻甲，防护不厚，胜在轻便。\n```", "这件东西正适合他，林夜当场换上。比起更重的甲胄，弓手在前期更需要的是不拖手脚的护具。何况这次还给了感知，对他来说比一味堆体质更顺手。", "等他把那枚污灰角芯收起来，再回头去看地上那片黑泥时，才发现黑斑角鹿最后撞开的土层下，埋着一截断掉的木牌边角。上头同样有猎鹰印，旁边却多了半行更难辨的旧字。", "“封……场……”", "林夜把那截木牌翻到背面，又看见一点快磨没了的刻痕，像某种编号。", "他站在药圃边沉默了片刻，心里已经明白，韩沉接下来终于该把真正的名字说出来了。"]}, {"id": "015", "title": "封场旧牌", "time": "2041年7月18日 07:06至07:52", "location": "东林残墙、封场外缘", "paragraphs": ["韩沉这次没有站在残墙边等，而是坐在一截半倒的老树根上，手里慢慢磨着一支旧箭。", "林夜把黑斑角鹿掉下来的角芯和那截写着“封场”的木牌递过去时，老人指尖终于停了一下。他先看了看那层灰，再看木牌边缘那道编号一样的刻痕，半晌才把东西接过来，轻轻叹了口气。", "“这么多年了，还真叫你把它翻出来了。”", "林夜站在一旁没催，只安静等着。", "过了一会儿，韩沉才把磨好的箭搁到膝边，抬眼看他：“东林最里面那段地方，早年叫封场。不是封给野兽的，是封给人的。谁想往后面走，先在里头活一遍，活下来了，后面的门才勉强算对你开半扇。活不下来，也省得死到更深处去。”", "这话说得平静，意思却一点不轻。", "林夜前世没真正进过这条线，如今听到这里，才把心里许多零碎东西连起来。残墙、枯井、旧药圃，这些并不是单独的藏宝点和刷怪区，而是一整套筛人的前置路。你不够细、不够稳、不够能扛，这一路根本走不到头。", "也难怪韩沉从头到尾都没把话说满。", "这种线，说得越明白，越不值钱。", "“我能进去？”林夜问。", "韩沉看了他一眼，眼神里第一次多出一点很淡的审视以外的东西，像是终于愿意认真拿他当个人看。", "“能不能进，不是我一句话说了算。”老人把那截木牌翻过来，指了指背面的编号，“这是封场的旧牌。原先配一整套，有进有出，也有记谁死在里头。你现在翻出来这半块，说明路还认得人。至于你进去以后能不能自己走出来，那就得看你自己。”", "系统提示在这时落了下来。", "【隐藏任务：东林封场】", "【前置已满足】", "【当前目标：进入封场外缘，完成第一轮试猎】", "【阶段奖励：经验96点，铜币10枚】", "经验一结算，林夜的等级也终于跟着往上抬了一步。", "【经验已满，等级提升】", "【当前等级：5】", "【职业技能解锁：拉步】", "五级的变化比四级更明显一点。暖意从肩背往下推开，原本已经被拉扯得有些发酸的手臂也松了些。林夜先把面板拉开，看了眼新技能。", "```text\n【拉步】\n【类型】：职业技能\n【来源】：弓箭手等级解锁\n【消耗】：10点法力\n【效果】：短时间内调整半个身位，并提升下一次射击的稳定性。\n【说明】：不是为了跑远，而是为了把出手位置拨准。\n```", "这技能来得很合时宜。", "弓箭手前期最怕的不是没伤害，而是很多时候差那半步。一步没让开，箭线就偏；一步让过了头，反而把自己送进怪嘴里。拉步这种技能看着不炸，却最适合他现在这条路。", "韩沉等他看完，才把半块木牌递了回来，连同木牌一起递过来的，还有一块薄薄的铁片。那铁片边缘磨圆了，像某种旧门扣上拆下来的残件。", "“封场外面有扇半埋的旧栏门。”他说，“牌子和门扣对上，门就开。进去以后别乱闯，先看脚下，再看风向，再看怪往哪儿逼你。你要是连第一轮都打不明白，后头那截路还是趁早别碰。”", "林夜接过铁片，点了点头。", "韩沉却在他转身前又补了一句：“还有一件事。你那天赋，别逮着什么都往里装。我不知道你那东西到底算什么，可一个人身上位子有限，塞错了，后头难受的是你自己。”", "林夜脚步微顿，回头看了他一眼。", "老人没解释自己是怎么察觉的，只低头继续磨那支箭，像刚才不过是随口一句提醒。可林夜心里却更沉了几分。他先前一直把“复制”的秘密压得很紧，如今看来，韩沉未必知道天赋的具体模样，却已经看出了他走法和普通人不一样。", "好在这老家伙说的，偏偏也正是他自己已经摸明白的东西。", "第一格要怎么用，后面的位子又要留给什么，越往后只会越难，不会更轻松。", "而封场，就是下一轮真正的筛法。"]}, {"id": "016", "title": "门开之前", "time": "2041年7月18日 07:52至09:03", "location": "青石村、东林封场外缘", "paragraphs": ["拿到封场门牌以后，林夜没有急着一头钻进去。", "他现在确实已经比绝大多数新手走得都靠前，手上有蓝弓、有银币、有轻身，还有一条别人根本不知道怎么开的暗线。可越是这样，他越不可能在这种节骨眼上犯“先进去再说”的毛病。封场既然是旧猎团拿来筛人的地方，那就绝不会因为他现在有点领先，就突然变得温和。", "回村的路上，林夜顺手清掉了两只从林边窜出来的风尾狸和一只裂齿蝠。经验条继续往前推，铜币也零零碎碎地涨了些。等他真正走回青石村时，早晨的光已经铺开了一半，村子里也比半夜热闹得多。", "很多玩家这会儿才刚把新手村的最基础节奏摸明白。村口草坡那边人明显更多，杂货铺门前已经有人开始算一瓶药值几枚铜，铁匠铺外头则围着一圈拎白装的，问修理和回收怎么算。林夜从他们身边过去时，心里很平。他知道这些人并不笨，只是还没踩到真正值钱的路上。等主城一开，很多聪明人自然会慢慢追上来。", "可在那之前，先手就是先手。", "铁匠看见他手里那张粗糙箭囊图纸时，黑着的脸总算松了一点。", "“这东西你从哪翻出来的，我不问。”他把图纸抖开看了两眼，又伸手敲了敲林夜背后的猎风长弓，“弓都像样了，总不能还背着那点可怜箭数满地跑。要做可以，粗皮、细绳，再加五十铜。”", "五十铜不算少。", "对刚进村的普通玩家来说，这已经是要攒好一阵的数。可林夜手里有银，听到价以后连眉头都没动一下。前期钱最值的时候，不是攒着看数字，而是该换成能把路线撑住的东西时就果断换掉。", "他当场把材料和钱都交了。", "铁匠动作很快，半个多小时后，一只能扩二十支箭位的粗糙箭囊便落到了林夜手里。", "```text\n【粗糙箭囊】\n【装备等级】：5\n【装备品质】：绿色·精良\n【装备部位】：副具\n【属性】：箭矢容量+20\n【属性】：更换箭矢速度小幅提升\n【说明】：做工谈不上好，胜在够用。\n```", "这类东西在后面不算稀罕，可在新手村阶段，意义却比一件普通绿装还直观。弓箭手很多节奏崩掉，不是因为打不过，而是因为箭没了、换箭慢了、补给跟不上。林夜把箭囊背到身上时，整个人都轻松了一截。", "随后他又去杂货铺补了两瓶微型生命药剂，一卷新绷带，再拿黑斑角鹿掉下来的鹿皮和豹牙换掉一部分杂物。银币袋一下去，手里的零钱反而更清楚了。", "```text\n【当前货币】：41铜 17银 0金\n```", "这就是有了第一桶金之后的底气。", "你不必在每一个小选择面前都磨半天，也不会因为买两瓶药就心疼得想再拖一拖。林夜把这些事做完以后，才在村口找了个安静角落坐下，啃了一块黑麦面包，顺手又把自己的面板重新理了一遍。", "```text\n【姓名】：林夜\n【等级】：5\n【当前经验】：47/660\n【职业】：弓箭手\n【生命】：141/141\n【法力】：60/60\n【力量】：8\n【敏捷】：13\n【体质】：10\n【精神】：4\n【感知】：10\n【天赋】：SSS级·复制\n【已复制天赋】：A级·轻身\n【技能】：直射、拉步\n【装备】：猎风长弓、鹿纹轻甲、豹皮护腕、轻皮束带、鹿皮轻靴、粗糙箭囊\n【货币】：41铜 17银 0金\n```", "看完以后，林夜心里更稳了些。", "这套面板还远远谈不上强，可放在青石村这个阶段，已经足够让他去碰很多普通玩家根本不该碰的地方。更重要的是，第一格复制位到现在依旧没有让他后悔。轻身不但带他翻过了断崖，也让他在黑斑角鹿那场战斗里把原本很难处理的烂地踩出了节奏。换成加速，他未必拿不下那场架，可很多细处都不会有现在这么顺。", "午前的风吹过村口时，林夜起身往东林去。封场外那扇半埋的旧栏门比他想的还更破，木头几乎烂透了，铁扣却还挂在原位。最显眼的是门柱外侧那一排深浅不一的划痕，有旧有新，显然不止一拨人曾经试图碰过它。", "林夜把半块木牌和那枚旧门扣对上去。", "咔的一声轻响，锈住多年的卡扣竟真的松了。", "门没自己弹开，只是向内裂出一条能容人侧身过去的缝。缝后立刻有风吹出来，那风比外面的林风更凉，也更沉，吹到脸上时，像带着一股陈在封闭地里很久的旧木和潮土气。", "林夜站在门外静了片刻，手掌握上弓背，随后才慢慢挤了进去。", "封场，终于开了。"]}, {"id": "017", "title": "第一段猎径", "time": "2041年7月18日 09:03至10:01", "location": "东林封场第一段", "paragraphs": ["封场里面没有普通意义上的路。", "更准确地说，这里有路，但路都不宽，像被人刻意压成只够一个人通过的长度和弯度。两边林木极密，地势也不是平的，而是一段高、一段低，时不时还有被刻意摆出来的断木、浅坑和碎石坡。林夜走进来没多久就明白，这地方根本不是给人舒服走路用的，它更像一套把人的节奏一寸寸挤出来的老机关。", "系统提示只在他踏进来那一刻亮了一下。", "【进入：东林封场·第一段】", "【当前目标：在折返前活着走过去】", "没有更细的说明，也没有什么“击杀多少怪”的明确要求。可也正因为这样，压迫感反而更重。因为你根本不知道前面会从哪一段开始给你上强度。", "林夜沿着最靠内侧的路慢慢推进，速度不快，视线却一直在扫两边草层和树根。果然，没走多远，前方半埋的浅坑里就突然窜出两只灰毛猎犬一样的怪物。", "```text\n【封场猎犬】\n【等级】：5\n【生命】：160/160\n【技能】：扑咬、协扑\n【说明】：行动成对，擅长逼位。\n```", "两只一左一右，根本不给你慢慢拉距离的机会。林夜第一反应就是往侧上方那根倒木边抢，他一到位，左边那只猎犬正好扑空，右边那只则被倒木拦了一下节奏。直射、普攻、拉步，三下几乎连成一线，先硬吃掉一只的半条命，另一只紧跟着又贴上来时，他干脆借轻身从倒木上斜踩过去，把自己从两犬中间抽开。", "这套动作做完，他自己心里都明白，换成没有轻身的开服第一夜，多半做不到这么利落。", "两只封场猎犬的掉落比外面稍好，经验也更足，可林夜根本没在意。他现在最关心的是封场里怪物的路数。第一波就是成对逼位，说明这里考的不是简单输出，而是人被包的时候，还能不能把自己从夹缝里拽出来。", "再往前十来分钟，林夜又先后碰上了埋在草里的踏板陷坑、从树后侧冲出来的硬角山羊，以及一只在碎石坡上来回借地势的影爪狸。每一段都不算完全致命，却一段比一段更会挑弓手难受的地方打。打到后头，林夜甚至有种很清楚的感觉，这地方当年被布出来时，就是按“怎么把远程职业逼到最狼狈”去想的。", "可越是这样，他反而越快进入状态。", "前世他在野外吃过太多这种恶心局，早就知道最怕的不是难，是一遇到难就想退。你越退，节奏越乱，最后整个人都会被地形牵着鼻子跑。反倒是先承认自己现在就站在难受的位置上，再一点点找能立住脚的地方，局面才会慢慢回到手里。", "打穿第三波怪时，系统终于又跳了一下。", "【完成封场第一段试猎】", "【获得经验118点】", "【获得：猎纹绳索x1】", "【获得：铜币8枚】", "经验涨得很快，却还没把他直接推上六级。林夜扶着膝盖缓了两口气，目光落到前方那块歪斜的旧木牌上。木牌只剩半截，上头刻着三个磨损严重的字。", "折返处。", "看到这三个字时，林夜不由得笑了一下，笑意却很淡。", "这名字起得真不客气。", "意思已经很明白了。走到这里的人，可以回头，也可以继续往前。前面显然才是封场真正开始吃人的地方，旧猎团甚至懒得拿话哄你，只留一块牌子，看你自己要不要再迈那一步。", "林夜站在那块牌子前，先把药剂和箭数都重新点了一遍，随后才抬脚越过去。", "既然都走到这儿了，他当然不可能回头。"]}, {"id": "018", "title": "箭上蓄锋", "time": "2041年7月18日 10:01至11:12", "location": "东林封场第二段", "paragraphs": ["第二段比第一段安静得多。", "也正因为安静，反而更压人。林夜走进来以后，最先感觉到的不是怪，而是风。这里的风会沿着林间几条窄道来回穿，吹得草叶和细枝不断偏向同一边。听久了，甚至会让人下意识把注意力全压到前方，忽略掉两侧那些真正藏着危险的地方。", "林夜却没让自己被带进去。", "他越往前走，脚步越轻。很快，左后方一截低树根旁便窜出一道细而快的影子，紧跟着第二道、第三道也从不同方向扑了出来。", "```text\n【影爪狸】\n【等级】：6\n【生命】：175/175\n【技能】：飞扑、折返、抓脸\n【说明】：喜欢连续打断目标的出手动作。\n```", "这东西最烦的，就是它不求一口咬死你，只求把你节奏剪碎。林夜前两箭刚压出去，就被其中一只影爪狸借树根反扑，险些把弓线撞歪。好在拉步在这种时候很顶用，半个身位往外拨开，立刻就把下一个出手角度抢了回来。", "可就算如此，三只一起上来，还是把林夜逼得很紧。", "他一边打，一边很快看出来了，这第二段其实在逼人学一件事，别总想着每一箭都舒服地拉满。你要是在这种地方还执着于“站定、瞄准、再出手”的标准节奏，那就永远会被打断。真正能活下去的，只能是在被逼着挤压出手时间的时候，还能把那支箭压稳。", "念头浮上来的那一瞬，林夜反而没再硬追那种完整开弓的手感。", "他开始收。", "收动作，收呼吸，收那些本来想一步拉到位的习惯。等第三只影爪狸又从右边扑上来时，他甚至没有像之前那样直接抬手就放，而是在弓线将满未满的那一下，多压了半个呼吸。", "时间很短，短到几乎只是一瞬。", "可那一瞬里，弓身上传回来的绷力、猎风长弓那种更清楚的回弹感，以及他前面一路打下来积住的那股火，像一下全被拧到了箭尖上。", "下一刻，箭出。", "-63。", "那只影爪狸几乎是被这一箭钉着翻出去的，连扑上来的势头都被硬生生截断。林夜自己都怔了一下，随后立刻明白，这一下和直射不一样。直射是系统给的标准答案，蓄住弓线再放这一下，却更像他在被逼到最难受的时候，自己挤出来的另一种解法。", "系统提示也在这时亮起。", "【你在高压实战中有所领悟】", "【自创技能雏形成形：蓄锋箭】", "```text\n【蓄锋箭】\n【类型】：自创技能\n【来源】：高压实战领悟\n【消耗】：12点法力\n【效果】：短暂蓄势后射出一箭，显著提升破甲与击退效果。\n【说明】：需要稳定出手节奏，若被打断，则技能失败。\n```", "林夜心口那点紧绷到现在才真正放开了一下。", "这就是他要的。", "不是无缘无故从天上掉下一本技能书，也不是系统到等级就把东西塞给你，而是某种真正贴着自己打法长出来的东西。它还不成熟，条件也苛，可一旦用出来，味道就完全不一样。", "后面那两只影爪狸再扑上来时，林夜的打法已经明显变了。他不再试图把每一下都打得规规矩矩，而是开始主动去找那种“刚刚够”的出手机会。能直射就直射，能普通箭补就补，真碰上必须一箭压停的关键点，才把蓄锋箭掏出来。", "就这么一路绷着打过去，第二段终于被他啃穿了大半。沿路的经验也把他的等级继续往上顶，等最后一只影爪狸倒下时，那道熟悉的升级暖流终于落了下来。", "【等级提升，当前等级：6】", "【当前经验】：74/900", "林夜扶着树干缓了一口气，刚想喝水，前方一片低草忽然齐齐伏了下去。像有什么体型更重的东西，终于听够了这里的动静，准备亲自出来看看是谁把第二段闹成这样。", "林夜把水收回去，重新握紧了弓。", "他知道，真正的大块头总算要露面了。"]}, {"id": "019", "title": "门前裂脊", "time": "2041年7月18日 11:12至12:26", "location": "东林封场第二段尽头", "paragraphs": ["从低草里压出来的不是鹿，也不是猎犬。", "那是一头背脊拱起的黑灰色獒兽，肩宽得吓人，嘴角两侧长出短而硬的骨刺，走动时几乎听不见多余的踩踏声，只有草面被它缓缓压开的沙沙响。它往前一站，第二段原本就不宽的路像一下被堵死了大半。", "```text\n【裂脊獒】\n【等级】：7\n【生命】：520/520\n【技能】：顶撞、扑压、低吼震停\n【说明】：封场第二段头目，专门猎杀试图强冲的人。\n```", "林夜看到“震停”两个字时，心里就知道这场架不好打。", "弓手最怕节奏被断，而这东西恰恰就会用最粗暴的法子让你断。前面那些影爪狸只是剪碎出手，它却能直接把你整个人按停一瞬。真要硬拼，蓄锋箭还没蓄完，多半就先被它打散。", "林夜没有后退，反倒先往右前方那块半高的石坎边上挪了两步。獒兽看见他动，肩背一沉，猛地就压了过来。第一下不是扑，是纯粹的顶。那股蛮力带着很重的风压，撞到脸上时连鼻腔都有点发闷。", "林夜早有准备，借轻身先把重心抽开，整个人擦着石坎外侧让过去，同时反手一箭顶进它前腿根部。", "-34。", "裂脊獒吃痛，转身比想象中还快。林夜刚想拉第二箭，对方喉咙里忽然滚出一声低沉短吼。那吼声不大，却震得人胸口一闷，手上动作也跟着慢了半拍。", "就是这半拍，裂脊獒已经扑了上来。", "林夜被逼得只能先滚。衣摆擦过碎草和土石，后肩还挨了獒爪边缘一下，血量当即掉下去一截。可他人刚稳住，就借拉步把下一次出手位置重新拨正，直射瞬间压了过去。", "-49。", "一箭打实，獒兽前冲被硬拦了半下。林夜不敢贪，立刻再退。前面几轮试猎已经把他打明白了，对这种头目，永远别想着用一套漂亮连招直接带走，先把它最想抢的节奏拿回来，才有后面的事。", "裂脊獒后面那几轮也确实都在抢节奏。低吼、顶撞、贴身扑压，几乎不给人完整拉弓的舒服机会。林夜最开始还会被逼得有些别扭，打到中段以后却慢慢习惯了。因为他忽然发现，蓄锋箭虽然怕被打断，却也不是非得在最安稳的时候才能用。很多时候，你只要能从那一大堆乱节奏里，硬抠出一个怪物刚收力、人还没完全被震乱的瞬间，这一箭照样能蓄出来。", "机会很快就来了。", "裂脊獒第三次顶撞石坎时，前爪在凸石上明显打滑了一下。那一下极轻，换成别人未必会当回事，林夜却立刻把弓提起，整个人稳稳踩住石坎外沿，呼吸猛地往里一收。", "蓄锋。", "弓线绷到将满未满，獒兽已经掉头扑了回来。若是稍慢一点，这一下就会被它整个人撞散。可林夜手里偏偏卡的就是这个点，等那道影子真正压到眼前时，箭已经先一步离弦。", "-86（蓄锋）", "裂脊獒像被一柄看不见的锤子当胸砸了一下，前扑的势头硬生生被钉停，连四肢都跟着往后一顿。林夜自己都被这一下打出来的手感震了一下，紧跟着却没有任何发怔，直射、普攻、侧挪，再接一箭，所有动作一口气压到底。", "-41。", "-33。", "-47。", "裂脊獒血线终于崩到危险边缘，喉咙里的低吼也再没先前那么稳。它还想最后扑一次，林夜却已经借着那块石坎把身位抽干净，最后一支蓄势未满的半步箭直接送进了它眼下。", "-52（弱点）", "獒兽轰然倒地。", "系统提示几乎连成一片。", "【击杀裂脊獒，获得经验480点】", "【完成封场第二段试猎，获得经验720点】", "【首次通过封场第二段，额外获得经验880点】", "【等级提升，当前等级：7】", "【等级提升，当前等级：8】", "【获得：獒骨扣x1】", "【获得：铜币18枚】", "【获得：封场旧钥x1】", "大量经验冲上来的那一瞬，林夜几乎能清楚感觉到自己整个人都被往上托了一截。手臂更稳，呼吸更长，连先前被震得有些发闷的胸口都松开了。等级连跳两级带来的实际提升，在这种高压后尤其明显。", "他靠着石坎缓了两口气，这才重新拉开面板。经验停在八级开头，距离九级还有一大段，可已经比他最早进村时快得多了。", "更让他在意的，是獒兽死后那扇慢慢露出来的旧门。", "门后挂着一块牌子，字迹比前面几块都更完整些。", "离场。", "林夜盯着那两个字看了几秒，心里却一点都不觉得轻松。因为这两个字放在这里，太古怪了。封场一路把人往里逼，到头来却挂一块“离场”的牌子，像是前面那一切都不是为了困住你，而是为了看你有没有资格自己走出去。", "他提起封场旧钥，慢慢走到门前。", "若这一扇门后真是最后一段，那么冲十级的机会，多半也就压在里面了。"]}, {"id": "020", "title": "离村之风", "time": "2041年7月18日 12:26至14:03", "location": "东林封场终段、青石村外路口", "paragraphs": ["旧门打开以后，里面没有怪的嘶吼，也没有立刻扑出来的影子。", "只有一条很长的坡路。", "坡路两侧立着断断续续的木桩，很多都已经倒了，只剩下半截埋在土里。更远处的树影深处，能看见几处极淡的灰白痕迹，像曾经有人在这里来回奔走，最后又把一切都留给了风。林夜往前走了几步，很快就明白了，这一段和前面不一样。", "这里不考你能不能停下来打赢某一只怪。", "它考的是你在不停、不退、不断被逼的情况下，还能不能把节奏抓在自己手里。", "系统提示也在这时落了下来。", "【进入：封场终段】", "【当前目标：抵达外路口】", "没有倒计时，可林夜几乎立刻就听见了后方传来的窸窣声。不是一只，是一串，像有整整一群什么东西被他迈进来的动静惊醒，正顺着坡路和林边同时压过来。", "第一批扑出来的是三只封场猎犬，两只影爪狸，还夹着一头从侧坡斜冲下来的硬角山羊。", "这种阵势下，你根本不可能像前面那样一只只慢慢拆。", "林夜脚下只顿了半瞬，整个人便已经动了起来。直射先压最靠前的猎犬，逼出一条能落脚的缝；拉步立刻跟上，把身位拨到坡路外侧；等第二只影爪狸借木桩扑过来时，他甚至连头都没完全回，反手一箭先把它钉歪，再借轻身带来的那点稳定，整个人从半塌的坡沿斜切下去。", "这一路不是在“打赢”，更像在“穿过去”。", "可这反而最考人。", "因为你既不能一味跑，也不能被任何一只怪彻底缠住。停太久，后面的犬会跟上；跑太急，前面的地形会把你摔回去；弓手最熟的那种慢慢拉距离，在这里根本用不上。林夜一路顶着这种压力往前走，走到中段时，甚至有种很清楚的感觉，封场真正想看的，大概就是这个，看你把武器、技能、地形、体力和胆子一股脑压在一起时，最后还剩下多少东西能用。", "坡路最险的一段，是一道被旧木桩和半塌土坎夹出来的狭口。林夜刚抢进去，后面两只猎犬就一前一后压了上来，右边林缝里还窜出一道更快的黑影。那东西速度比影爪狸还快，几乎贴地无声，冲出来时只在视野边缘掠起一丝灰光。", "林夜心里一凛，几乎不用看清就知道，这才是封场最后埋着的真正杀招。", "```text\n【封场逐影兽】\n【等级】：8\n【生命】：420/420\n【技能】：影掠、扑杀、折返追击\n【说明】：终段猎杀者，会在目标体力和注意力下滑时突然收尾。\n```", "这一瞬间，林夜反而彻底冷静了。", "他前面一路被逼到这里，不就是在等这种东西吗？如果终段连个像样的收尾都没有，这条封场线反倒配不上韩沉那副神情。", "逐影兽第一次扑上来时，林夜没有硬接，先把两只猎犬带到同一条线里，再借狭口右壁往上一踩。轻身在这一刻几乎被他用到了极致，身体刚刚离开地面的半步，反手直射已经落下，正好把左边那只猎犬头一压。它一歪，后头的逐影兽扑线也跟着乱了一寸。", "就是这一寸，够了。", "林夜落地后没有再求稳，而是直接把前面攒下来的那口气全逼进了弓里。蓄锋箭不是每一轮都能用，可只要找到那个瞬间，它就足够把最关键的一只东西钉停。逐影兽第二次折返扑来时，林夜甚至没再退，脚底稳稳卡住那块半露的硬根，弓线猛地绷满。", "箭出。", "-91（蓄锋）", "逐影兽被这一箭打得身子一仰，整个扑杀动作硬生生崩开。林夜趁它失衡，直射和普攻几乎连成一片，把它血线往下猛压。后面两只猎犬刚想补上，逐影兽却已经先撑不住，轰地摔在狭口前。剩下那点杂怪立刻没了先前那股咬死人的凶劲，被林夜一路边打边走，最终硬生生拖穿了整条坡道。", "等他踏出最后一根断桩范围时，身后的动静竟真慢慢停了。", "像这条路只认你有没有本事闯出来，一旦你闯出来了，它也就不再追。", "系统提示在这一刻接连亮起，密得几乎看不清。", "【完成隐藏任务：东林封场】", "【获得经验1620点】", "【首次通过封场终段，额外获得经验1880点】", "【获得：封场通牌x1】", "【获得：铜币30枚】", "【获得：银币12枚】", "【获得：追风指环x1】", "【等级提升，当前等级：9】", "【等级提升，当前等级：10】", "【复制位开启：2/2】", "一连串提示砸下来的同时，林夜只觉得胸口、肩背和四肢像一下被灌进了更充实也更沉稳的力量。十级和前面每一级都不太一样，不只是属性往上跳了一截，更像有一道真正的门槛被你亲手推开了。", "他站在外路口，先缓了足足十几秒，才把面板拉开。", "```text\n【姓名】：林夜\n【等级】：10\n【当前经验】：108/2320\n【职业】：弓箭手\n【生命】：191/191\n【法力】：85/85\n【力量】：13\n【敏捷】：18\n【体质】：15\n【精神】：4\n【感知】：15\n【天赋】：SSS级·复制\n【已复制天赋一】：A级·轻身\n【已复制天赋二】：空置\n【技能】：直射、拉步、蓄锋箭\n【装备】：猎风长弓、鹿纹轻甲、豹皮护腕、轻皮束带、鹿皮轻靴、粗糙箭囊、追风指环\n【货币】：71铜 29银 0金\n```", "第二复制位在面板上安静亮着，像一扇刚刚被推开的新门。", "林夜盯着那一栏看了好一会儿，心里却没有半点“立刻找个东西塞进去”的冲动。若是刚进游戏那会儿的他，或许还会因为多开一格而本能心热一下。可现在不一样了。他已经亲手吃过第一格的犹豫、试探和取舍，也亲手看见了七十二小时冷却到底意味着什么。", "位子开了，不等于就该乱填。", "这次他连多想都没多想，直接把第二格留空。", "反正他真正想要的下一份东西，本来也不在青石村里。", "外路口旁边立着一块更旧的石牌，石面裂得厉害，上头只剩下半段还能认。林夜把上面的泥慢慢抹开，看见了几个断断续续的旧字。", "“……猎团失守……黑潮……”", "后面已经看不清了。", "可光是这几个字，就足够让他站在那里沉默好一阵。因为这些东西，在一个新手村阶段，本来就不该这么早露出来。", "风从外路口吹过来，比东林里面更开阔，也更亮。林夜把那块石牌上的灰拍干净，转身朝青石村外真正的离路望去。", "这一路到这里，总算叫他把最开始想抢的东西都抢到了。", "十级，第二复制位，第一套能看的装备，三项常用技能，一条已经走通的隐藏线，以及足够把接下来那段路撑住的钱。", "现在再回头看开服前夜，他脑子里那点混乱和不确定其实还历历在目。那时候的他根本不知道复制具体会怎么运作，更不知道第一格该押在什么东西上。是一路试下来、看下来、想明白替换和冷却以后，他才真正敢把轻身按下去。也正因为这一格按得够稳，后面这一整段路才会越走越顺。", "而接下来，青石村已经困不住他了。"]}];
    const chapterMap = new Map(chapters.map(ch => [ch.id, ch]));
    const chapterSelect = document.getElementById('chapter');

    for (const ch of chapters) {
      const opt = document.createElement('option');
      opt.value = ch.id;
      opt.textContent = '第' + ch.id + '章';
      chapterSelect.appendChild(opt);
    }

    function getCurrentChapterId() {
      const params = new URLSearchParams(location.search);
      const raw = params.get('chapter') || chapters[0].id;
      return chapterMap.has(raw) ? raw : chapters[0].id;
    }

    function setNav(id) {
      const index = chapters.findIndex(ch => ch.id === id);
      const prev = chapters[Math.max(0, index - 1)];
      const next = chapters[Math.min(chapters.length - 1, index + 1)];
      const prevHref = './index.html?chapter=' + prev.id;
      const nextHref = './index.html?chapter=' + next.id;
      document.getElementById('prev').href = prevHref;
      document.getElementById('next').href = nextHref;
      document.getElementById('prevBottom').href = prevHref;
      document.getElementById('nextBottom').href = nextHref;
      chapterSelect.value = id;
    }

    function render() {
      const id = getCurrentChapterId();
      const ch = chapterMap.get(id);
      setNav(id);
      document.title = '第' + id + '章 ' + ch.title + ' - 《天灾》小说阅读';
      document.getElementById('title').textContent = '第' + id + '章 ' + ch.title;
      document.getElementById('chapterMeta').innerHTML =
        '<div>时间：' + ch.time + '</div>' +
        '<div>地点：' + ch.location + '</div>';
      document.getElementById('content').innerHTML = ch.paragraphs
        .map(p => '<p>' + p
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/`/g, '') + '</p>')
        .join('');
    }

    chapterSelect.addEventListener('change', (e) => {
      location.href = './index.html?chapter=' + e.target.value;
    });

    render();
  </script>
